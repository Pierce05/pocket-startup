<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourPool - Tour Guide & Staff Tip Splitter</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --error: #dc2626;
            --error-bg: #fef2f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.875rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .tip-btn {
            padding: 0.5rem;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tip-btn:hover, .tip-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        button#calc {
            width: 100%;
            padding: 0.875rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        button#calc:hover {
            background: var(--primary-hover);
        }

        #error {
            display: none;
            background-color: var(--error-bg);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1.25rem;
            text-align: center;
            border: 1px solid #fecaca;
        }

        #result {
            display: none;
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 0.5rem;
            text-align: center;
        }

        #result h3 {
            color: #166534;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        #result .amount {
            font-size: 2.25rem;
            font-weight: 700;
            color: #15803d;
        }

        #result .breakdown {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TourPool</h1>
            <p>Effortlessly calculate and distribute tips among tour guides and staff.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Total Group Trip Cost / Revenue ($)</label>
                <input type="number" id="bill" value="100" placeholder="e.g. 1500.00" min="0" step="0.01">
            </div>

            <div class="form-group">
                <label for="tip">Tip Percentage (%)</label>
                <input type="number" id="tip" value="20" placeholder="e.g. 15" min="0" step="0.1">
                <div class="tip-buttons">
                    <button type="button" class="tip-btn" data-val="10">10%</button>
                    <button type="button" class="tip-btn" data-val="15">15%</button>
                    <button type="button" class="tip-btn active" data-val="20">20%</button>
                    <button type="button" class="tip-btn" data-val="30">30%</button>
                </div>
            </div>

            <div class="form-group">
                <label for="people">Number of Staff Members (Pool)</label>
                <input type="number" id="people" placeholder="e.g. 3" min="1" step="1" value="1">
            </div>

            <button type="button" id="calc">Calculate Pool Distribution</button>

            <div id="error"></div>
            <div id="result">
                <h3>Per-Person Share</h3>
                <div class="amount" id="result-amount">30.00</div>
                <div class="breakdown" id="result-breakdown"></div>
            </div>
        </main>
    </div>

    <script>
        const tipButtons = document.querySelectorAll('.tip-btn');
        const tipInput = document.getElementById('tip');
        const calcButton = document.getElementById('calc');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const resultAmount = document.getElementById('result-amount');
        const resultBreakdown = document.getElementById('result-breakdown');

        tipButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tipButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tipInput.value = btn.getAttribute('data-val');
            });
        });

        tipInput.addEventListener('input', () => {
            tipButtons.forEach(b => {
                if (b.getAttribute('data-val') === tipInput.value) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            });
        });

        calcButton.addEventListener('click', () => {
            const billVal = document.getElementById('bill').value.trim();
            const tipVal = tipInput.value.trim();
            const peopleVal = document.getElementById('people').value.trim();

            const bill = parseFloat(billVal);
            const tipPercent = parseFloat(tipVal);
            const people = parseInt(peopleVal, 10);

            // Validation checks
            if (billVal === '' || tipVal === '' || peopleVal === '') {
                showError('Please fill in all required fields.');
                return;
            }

            if (isNaN(bill) || isNaN(tipPercent) || isNaN(people)) {
                showError('Please enter valid numeric values for all fields.');
                return;
            }

            if (bill < 0) {
                showError('Trip cost cannot be a negative number.');
                return;
            }

            if (tipPercent < 0) {
                showError('Tip percentage cannot be negative.');
                return;
            }

            if (people <= 0 || !Number.isInteger(people)) {
                showError('Number of staff members must be a whole number greater than zero.');
                return;
            }

            // Calculation
            const totalTip = bill * (tipPercent / 100);
            const perPerson = totalTip / people;

            // Display results
            errorDiv.style.display = 'none';
            resultAmount.textContent = `${perPerson.toFixed(2)}`;
            resultBreakdown.textContent = `Total Tip Pool: $${totalTip.toFixed(2)} split among ${people} staff member(s).`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            resultDiv.style.display = 'none';
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
