<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillSplit</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --error-bg: #fef2f2;
            --error-text: #991b1b;
            --border: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            text-align: center;
            color: var(--primary);
        }

        .pitch {
            text-align: center;
            color: var(--text-light);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
        }

        input {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
            text-align: center;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: #166534;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BillSplit</h1>
        <p class="pitch">Quickly calculate individual totals, taxes, and tips for shared restaurant bills.</p>

        <div class="input-group">
            <label for="bill">Bill Total ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="input-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" min="0" placeholder="15">
        </div>

        <div class="input-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" step="1" min="1" placeholder="1">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value;
            const tipInput = document.getElementById('tip').value;
            const peopleInput = document.getElementById('people').value;

            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');

            // Clear previous states
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';

            // Check if fields are empty
            if (billInput === '' || tipInput === '' || peopleInput === '') {
                errorDiv.textContent = 'Please fill out all fields.';
                errorDiv.style.display = 'block';
                return;
            }

            const bill = parseFloat(billInput);
            const tip = parseFloat(tipInput);
            const people = Number(peopleInput);

            // Validation checks:
            // 1. Bill >= 0
            // 2. Tip >= 0
            // 3. People must be a whole number > 0
            if (isNaN(bill) || bill < 0) {
                errorDiv.textContent = 'Please enter a valid bill amount greater than or equal to 0.';
                errorDiv.style.display = 'block';
                return;
            }

            if (isNaN(tip) || tip < 0) {
                errorDiv.textContent = 'Please enter a valid tip percentage greater than or equal to 0.';
                errorDiv.style.display = 'block';
                return;
            }

            if (!Number.isInteger(people) || people <= 0) {
                errorDiv.textContent = 'Number of people must be a whole number greater than zero.';
                errorDiv.style.display = 'block';
                return;
            }

            // Calculation
            const totalTip = bill * (tip / 100);
            const totalAmount = bill + totalTip;
            const perPerson = totalAmount / people;

            // Display result
            resultDiv.textContent = `Per Person: $${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
