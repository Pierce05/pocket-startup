<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingSplit - Elegant Bill Settlement</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b22;
            --accent: #d4af37;
            --accent-hover: #e6c555;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2d3139;
            --error: #f87171;
            --success: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-family: serif;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            letter-spacing: 0.02em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input.has-prefix {
            padding-left: 2rem;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn-calc {
            width: 100%;
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 1rem;
            letter-spacing: 0.05em;
        }

        .btn-calc:hover {
            background-color: var(--accent-hover);
        }

        .btn-calc:active {
            transform: scale(0.99);
        }

        #error {
            background-color: rgba(248, 113, 113, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-top: 1.25rem;
            text-align: center;
            display: none;
        }

        #result {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            text-align: center;
            display: none;
        }

        .result-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .result-amount {
            font-size: 2.25rem;
            font-weight: bold;
            color: var(--success);
            font-family: serif;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>WeddingSplit</h1>
            <p>Calculate individual table shares & service charges</p>
        </div>

        <div class="form-group">
            <label for="bill">Wedding Dinner Bill Subtotal</label>
            <div class="input-wrapper">
                <span class="prefix">$</span>
                <input type="number" id="bill" class="has-prefix" placeholder="0.00" step="0.01" min="0">
            </div>
        </div>

        <div class="form-group">
            <label for="people">Number of Guests at Table</label>
            <input type="number" id="people" placeholder="1" min="1" step="1">
        </div>

        <div class="form-group">
            <label for="tip">Service Charge & Custom Tip (%)</label>
            <input type="number" id="tip" placeholder="20" min="0" step="0.1">
        </div>

        <button id="calc" class="btn-calc">Split Table Bill</button>

        <div id="error"></div>
        <div id="result">
            <div class="result-label">Per Person Share</div>
            <div id="result-amount" class="result-amount">$0.00</div>
        </div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const resultAmount = document.getElementById('result-amount');

            // Reset states
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            resultAmount.textContent = '';

            // Parse values
            const bill = parseFloat(billInput);
            const peopleNum = Number(peopleInput);
            const people = parseInt(peopleInput, 10);
            const tip = tipInput === '' ? 0 : parseFloat(tipInput);

            // Validation logic
            let errorMessage = '';

            if (billInput === '' || isNaN(bill) || bill < 0) {
                errorMessage = 'Please enter a valid table bill amount.';
            } else if (peopleInput === '' || isNaN(peopleNum) || peopleNum <= 0 || !Number.isInteger(peopleNum)) {
                errorMessage = 'Please enter a valid whole number of guests (at least 1).';
            } else if (tipInput !== '' && (isNaN(tip) || tip < 0)) {
                errorMessage = 'Please enter a valid tip or service charge percentage.';
            }

            if (errorMessage) {
                errorDiv.textContent = errorMessage;
                errorDiv.style.display = 'block';
                return;
            }

            // Calculation
            const totalWithTip = bill * (1 + (tip / 100));
            const perPerson = totalWithTip / people;

            // Display results
            resultAmount.textContent = '$' + perPerson.toFixed(2);
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
