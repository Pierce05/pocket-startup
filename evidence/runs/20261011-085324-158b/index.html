<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingTab - Dinner Bill Splitter</title>
    <style>
        :root {
            --primary: #835255;
            --primary-dark: #633d3f;
            --accent: #d4af37;
            --bg: #fdfbf7;
            --card-bg: #ffffff;
            --text: #2c2c2c;
            --error-bg: #fde8e8;
            --error-text: #9b1c1c;
            --success-bg: #f3f8f4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(131, 82, 85, 0.1);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            box-sizing: border-box;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0 0 8px 0;
            font-size: 26px;
            font-family: Georgia, serif;
        }

        .header p {
            color: #666;
            margin: 0;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fff;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            display: none;
            text-align: center;
            border: 1px solid #f8b4b4;
        }

        #result {
            background-color: var(--success-bg);
            color: var(--primary);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            display: none;
            border: 1px solid #c6e1cb;
        }

        .result-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: #555;
        }

        .result-amount {
            font-size: 32px;
            font-weight: bold;
            font-family: Georgia, serif;
            color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>WeddingTab</h1>
            <p>Split wedding dinner bills and service charges effortlessly.</p>
        </div>

        <div class="input-group">
            <label for="bill">Total Table Bill ($)</label>
            <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
        </div>

        <div class="input-group">
            <label for="tip">Service Charge / Tip (%)</label>
            <input type="number" id="tip" placeholder="18" step="0.1" min="0">
        </div>

        <div class="input-group">
            <label for="people">Number of Guests</label>
            <input type="number" id="people" placeholder="1" step="1" min="1">
        </div>

        <button id="calc">Calculate Share</button>

        <div id="error"></div>
        <div id="result">
            <div class="result-label">Amount Per Guest</div>
            <div id="result-value" class="result-amount">$0.00</div>
        </div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billRaw = document.getElementById('bill').value.trim();
            const tipRaw = document.getElementById('tip').value.trim();
            const peopleRaw = document.getElementById('people').value.trim();

            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const resultValue = document.getElementById('result-value');

            // Reset visibility
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            errorDiv.textContent = '';

            // Check inputs for emptiness
            if (billRaw === '' || tipRaw === '' || peopleRaw === '') {
                showError('Please fill out all fields before calculating.');
                return;
            }

            const bill = Number(billRaw);
            const tip = Number(tipRaw);
            const people = Number(peopleRaw);

            // Validation checks according to prompt spec
            if (isNaN(bill) || bill < 0) {
                showError('Please enter a valid bill amount greater than or equal to zero.');
                return;
            }

            if (isNaN(tip) || tip < 0) {
                showError('Please enter a valid tip percentage greater than or equal to zero.');
                return;
            }

            if (isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Please enter a whole number of guests greater than zero.');
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalBill = bill + tipAmount;
            const perPerson = totalBill / people;

            // Display result
            resultValue.textContent = '$' + perPerson.toFixed(2);
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
