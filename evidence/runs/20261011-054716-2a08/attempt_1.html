<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabSplitter - Airport Ride Fare Splitter</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5Rem;
            color: var(--text);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        #result {
            margin-top: 1.5rem;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.25rem;
            text-align: center;
            display: none;
        }

        .result-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>CabSplitter</h1>
            <p>Easily split taxi fares and tips among groups sharing an airport ride.</p>
        </div>

        <div class="form-group">
            <label for="bill">Metered Fare & Tolls ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" min="0" placeholder="15">
        </div>

        <div class="form-group">
            <label for="people">Number of Passengers</label>
            <input type="number" id="people" step="1" min="1" placeholder="1">
        </div>

        <button id="calc">Split Fare</button>

        <div id="error"></div>
        <div id="result">
            <div class="result-label">Amount Per Person</div>
            <div id="result-value" class="result-value">$0.00</div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const calcButton = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const resultValueDiv = document.getElementById('result-value');
        const errorDiv = document.getElementById('error');

        calcButton.addEventListener('click', () => {
            // Reset states
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';

            // Parse inputs
            const billStr = billInput.value.trim();
            const peopleStr = peopleInput.value.trim();
            const tipStr = tipInput.value.trim();

            const bill = parseFloat(billStr);
            const people = parseFloat(peopleStr);
            const tip = tipStr === '' ? 0 : parseFloat(tipStr);

            // Validation checks
            if (billStr === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid fare amount (0 or greater).');
                return;
            }

            if (tipStr !== '' && (isNaN(tip) || tip < 0)) {
                showError('Please enter a valid tip percentage (0 or greater).');
                return;
            }

            if (peopleStr === '' || isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Please enter a valid whole number of passengers (1 or greater).');
                return;
            }

            // Calculation
            const totalWithTip = bill * (1 + tip / 100);
            const perPerson = totalWithTip / people;

            // Display results
            resultValueDiv.textContent = `$${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
