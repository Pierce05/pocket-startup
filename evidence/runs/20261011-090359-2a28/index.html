<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalonPool Tips</title>
    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --bg: #fdf8f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --error: #dc2626;
            --error-bg: #fee2e2;
            --success-bg: #fef3c7;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
            color: var(--text);
        }

        p.pitch {
            font-size: 0.875rem;
            color: var(--text-light);
            margin: 0;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 0.75rem;
            color: var(--text-light);
            font-size: 1rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 0.75rem 0.75rem 2rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input.no-prefix {
            padding-left: 0.75rem;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            display: none;
            background-color: var(--error-bg);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            font-weight: 500;
        }

        #result {
            display: none;
            background-color: var(--success-bg);
            color: var(--text);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            text-align: center;
            font-size: 1.125rem;
            font-weight: 600;
        }
        
        #result span {
            color: var(--primary-hover);
            font-size: 1.25rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SalonPool Tips</h1>
            <p class="pitch">Easily split and track pooled tips fairly among your salon team.</p>
        </header>

        <div class="form-group">
            <label for="bill">Total Service Amount ($)</label>
            <div class="input-wrapper">
                <span class="prefix">$</span>
                <input type="number" id="bill" step="0.01" placeholder="0.00">
            </div>
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <div class="input-wrapper">
                <input type="number" id="tip" class="no-prefix" step="any" placeholder="15">
            </div>
        </div>

        <div class="form-group">
            <label for="people">Number of Team Members</label>
            <div class="input-wrapper">
                <input type="number" id="people" class="no-prefix" step="1" placeholder="1">
            </div>
        </div>

        <button id="calc">Calculate Pool Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value;
            const tipInput = document.getElementById('tip').value;
            const peopleInput = document.getElementById('people').value;

            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');

            // Reset states
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.textContent = '';

            // Parse values
            const bill = parseFloat(billInput);
            const tip = parseFloat(tipInput);
            const people = Number(peopleInput);

            // Validation checks
            if (billInput === '' || tipInput === '' || peopleInput === '') {
                errorDiv.textContent = 'Please fill out all fields.';
                errorDiv.style.display = 'block';
                return;
            }

            if (isNaN(bill) || bill < 0) {
                errorDiv.textContent = 'Bill amount must be zero or greater.';
                errorDiv.style.display = 'block';
                return;
            }

            if (isNaN(tip) || tip < 0) {
                errorDiv.textContent = 'Tip percentage must be zero or greater.';
                errorDiv.style.display = 'block';
                return;
            }

            if (!Number.isInteger(people) || people <= 0 || isNaN(people)) {
                errorDiv.textContent = 'Number of people must be a whole number greater than zero.';
                errorDiv.style.display = 'block';
                return;
            }

            // Calculation
            const totalTip = bill * (tip / 100);
            const totalAmount = bill + totalTip;
            const perPerson = totalAmount / people;

            // Display results
            resultDiv.innerHTML = `Per-Person Share: <span>$${perPerson.toFixed(2)}</span>`;
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
