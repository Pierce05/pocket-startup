<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groceries Splitter</title>
    <style>
        :root {
            --primary: #2f855a;
            --primary-hover: #276749;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-light: #718096;
            --error-bg: #fff5f5;
            --error-border: #feb2b2;
            --error-text: #c53030;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-light);
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 14px;
            color: var(--text-light);
            font-size: 16px;
        }

        .suffix {
            position: absolute;
            right: 14px;
            color: var(--text-light);
            font-size: 16px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input.has-prefix {
            padding-left: 30px;
        }

        input.has-suffix {
            padding-right: 30px;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(47, 133, 90, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            display: none;
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
        }

        #result {
            display: none;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }

        .result-label {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .result-amount {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Groceries Splitter</h1>
            <p>Easily split shared grocery receipts and delivery tips among roommates.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Grocery Bill</label>
            <div class="input-wrapper">
                <span class="prefix">$</span>
                <input type="number" id="bill" class="has-prefix" placeholder="0.00" step="0.01" min="0">
            </div>
        </div>

        <div class="form-group">
            <label for="tip">Delivery Tip & Fees (%)</label>
            <div class="input-wrapper">
                <input type="number" id="tip" class="has-suffix" placeholder="15" step="any" min="0">
                <span class="suffix">%</span>
            </div>
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <div class="input-wrapper">
                <input type="number" id="people" placeholder="1" step="1" min="1">
            </div>
        </div>

        <button id="calc">Calculate Share</button>

        <div id="error"></div>
        <div id="result">
            <div class="result-label">Each person pays</div>
            <div class="result-amount" id="result-amount">$0.00</div>
        </div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value;
            const tipInput = document.getElementById('tip').value;
            const peopleInput = document.getElementById('people').value;

            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            const resultAmountEl = document.getElementById('result-amount');

            // Reset views
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';

            // Parse values
            const bill = parseFloat(billInput);
            const tip = parseFloat(tipInput);
            const people = Number(peopleInput);

            // Validation checks
            if (billInput.trim() === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid, non-negative grocery bill amount.');
                return;
            }

            if (tipInput.trim() === '' || isNaN(tip) || tip < 0) {
                showError('Please enter a valid, non-negative tip percentage.');
                return;
            }

            if (peopleInput.trim() === '' || isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Please enter a whole number of people greater than zero.');
                return;
            }

            // Calculation
            const totalWithTip = bill * (1 + (tip / 100));
            const perPerson = totalWithTip / people;

            // Display results
            resultAmountEl.textContent = `$${perPerson.toFixed(2)}`;
            resultEl.style.display = 'block';
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
