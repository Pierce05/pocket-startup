<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillSplit - Split Bills & Calculate Tips</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --error: #dc2626;
            --error-bg: #fee2e2;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        header p {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix, .suffix {
            position: absolute;
            color: var(--text-light);
            font-size: 1rem;
        }

        .prefix {
            left: 0.75rem;
        }

        .suffix {
            right: 0.75rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .has-prefix input {
            padding-left: 2rem;
        }

        .has-suffix input {
            padding-right: 2rem;
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .tip-btn {
            background-color: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            padding: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tip-btn:hover {
            background-color: #e2e8f0;
        }

        .tip-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        button#calc {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button#calc:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error);
            font-size: 0.875rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        #result-container {
            margin-top: 1.5rem;
            background-color: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
            display: none;
        }

        #result-container h3 {
            font-size: 0.875rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        #result {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BillSplit</h1>
            <p>Easily split restaurant bills and calculate tips</p>
        </header>

        <div class="input-group">
            <label for="bill">Bill Total</label>
            <div class="input-wrapper has-prefix">
                <span class="prefix">$</span>
                <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
            </div>
        </div>

        <div class="input-group">
            <label for="tip">Tip Percentage</label>
            <div class="input-wrapper has-suffix">
                <input type="number" id="tip" placeholder="15" value="15" min="0" step="1">
                <span class="suffix">%</span>
            </div>
            <div class="tip-buttons">
                <button type="button" class="tip-btn" data-tip="10">10%</button>
                <button type="button" class="tip-btn" data-tip="15">15%</button>
                <button type="button" class="tip-btn" data-tip="18">18%</button>
                <button type="button" class="tip-btn" data-tip="20">20%</button>
            </div>
        </div>

        <div class="input-group">
            <label for="people">Number of People</label>
            <div class="input-wrapper">
                <input type="number" id="people" placeholder="1" value="1" min="1" step="1">
            </div>
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>

        <div id="result-container">
            <h3>Amount Per Person</h3>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const tipInput = document.getElementById('tip');
        const peopleInput = document.getElementById('people');
        const calcBtn = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const resultContainer = document.getElementById('result-container');
        const errorDiv = document.getElementById('error');
        const tipButtons = document.querySelectorAll('.tip-btn');

        function updateActiveTipButton() {
            const currentTip = parseFloat(tipInput.value);
            tipButtons.forEach(btn => {
                if (parseFloat(btn.dataset.tip) === currentTip) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        updateActiveTipButton();

        tipButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tipInput.value = btn.dataset.tip;
                updateActiveTipButton();
            });
        });

        tipInput.addEventListener('input', updateActiveTipButton);

        calcBtn.addEventListener('click', () => {
            const billValue = billInput.value.trim();
            const tipValue = tipInput.value.trim();
            const peopleValue = peopleInput.value.trim();

            const bill = parseFloat(billValue);
            const tipPct = parseFloat(tipValue);
            const people = Number(peopleValue);

            if (billValue === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid bill total.');
                return;
            }

            if (tipValue === '' || isNaN(tipPct) || tipPct < 0) {
                showError('Please enter a valid tip percentage.');
                return;
            }

            if (peopleValue === '' || isNaN(people) || people <= 0 || !Number.isInteger(people)) {
                showError('Please enter a valid whole number of people (at least 1).');
                return;
            }

            hideError();
            const totalTip = bill * (tipPct / 100);
            const totalAmount = bill + totalTip;
            const perPerson = totalAmount / people;

            resultDiv.textContent = '$' + perPerson.toFixed(2);
            resultContainer.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            resultDiv.textContent = '';
            resultContainer.style.display = 'none';
        }

        function hideError() {
            errorDiv.textContent = '';
            errorDiv.style.display = 'none';
        }
    </script>
</body>
</html>
