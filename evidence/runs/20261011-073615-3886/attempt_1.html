<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrunchSplit - Instant Brunch Bill Splitter</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --bg: #fffbeb;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --error: #dc2626;
            --error-bg: #fef2f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.1), 0 8px 10px -6px rgba(245, 158, 11, 0.1);
            padding: 2rem;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            color: var(--primary-dark);
            font-size: 1.875rem;
            margin-bottom: 0.25rem;
        }

        .header p {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix, .suffix {
            position: absolute;
            color: var(--text-light);
            font-size: 1rem;
            pointer-events: none;
        }

        .prefix {
            left: 0.75rem;
        }

        .suffix {
            right: 0.75rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input.has-prefix {
            padding-left: 2rem;
        }

        input.has-suffix {
            padding-right: 2rem;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .tip-btn {
            padding: 0.5rem;
            background: #f3f4f6;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tip-btn:hover {
            background: #e5e7eb;
        }

        .tip-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary-dark);
        }

        button#calc {
            width: 100%;
            padding: 0.875rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button#calc:hover {
            background: var(--primary-dark);
        }

        #error {
            background: var(--error-bg);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            border: 1px solid #fecaca;
            display: none;
        }

        #result {
            margin-top: 1.5rem;
            background: #fff7ed;
            border: 1px solid #ffedd5;
            border-radius: 0.75rem;
            padding: 1.25rem;
            text-align: center;
            display: none;
        }

        .result-label {
            font-size: 0.875rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .result-amount {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🍳 BrunchSplit</h1>
            <p>Split your group brunch bills instantly and calculate suggested tips effortlessly.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Bill Amount</label>
            <div class="input-wrapper">
                <span class="prefix">$</span>
                <input type="number" id="bill" class="has-prefix" placeholder="0.00" step="0.01" min="0">
            </div>
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" placeholder="1" min="1" step="1" value="1">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage</label>
            <div class="tip-buttons">
                <button type="button" class="tip-btn" data-val="15">15%</button>
                <button type="button" class="tip-btn" data-val="18">18%</button>
                <button type="button" class="tip-btn active" data-val="20">20%</button>
                <button type="button" class="tip-btn" data-val="25">25%</button>
            </div>
            <div class="input-wrapper">
                <input type="number" id="tip" class="has-suffix" value="20" min="0" step="1">
                <span class="suffix">%</span>
            </div>
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        
        <div id="result">
            <div class="result-label">Per Person Amount</div>
            <div id="result-amount" class="result-amount">$0.00</div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const calcBtn = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const resultAmountDiv = document.getElementById('result-amount');
        const errorDiv = document.getElementById('error');
        const tipBtns = document.querySelectorAll('.tip-btn');

        // Handle quick tip button selection
        tipBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tipBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tipInput.value = btn.getAttribute('data-val');
            });
        });

        // Clear active buttons if user types custom tip
        tipInput.addEventListener('input', () => {
            const val = tipInput.value;
            tipBtns.forEach(b => {
                if (b.getAttribute('data-val') === val) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            });
        });

        calcBtn.addEventListener('click', () => {
            const billValue = parseFloat(billInput.value);
            const peopleValue = parseInt(peopleInput.value, 10);
            const tipValue = parseFloat(tipInput.value);

            // Validation checks
            let errorMessage = '';

            if (isNaN(billValue) || billValue < 0) {
                errorMessage = 'Please enter a valid total bill amount.';
            } else if (isNaN(peopleValue) || peopleValue <= 0 || !Number.isInteger(peopleValue)) {
                errorMessage = 'Please enter a valid whole number of people (at least 1).';
            } else if (isNaN(tipValue) || tipValue < 0) {
                errorMessage = 'Please enter a valid tip percentage.';
            }

            if (errorMessage) {
                errorDiv.textContent = errorMessage;
                errorDiv.style.display = 'block';
                resultDiv.style.display = 'none';
                return;
            }

            // Hide error and compute
            errorDiv.style.display = 'none';

            const totalWithTip = billValue * (1 + (tipValue / 100));
            const perPerson = totalWithTip / peopleValue;

            resultAmountDiv.textContent = `$${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
