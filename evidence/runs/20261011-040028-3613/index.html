<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabSplit - Airport Cab & Ride Fare Splitter</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #cbd5e1;
            --error: #dc2626;
            --error-bg: #ffeeef;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            color: var(--primary);
        }

        .header p {
            margin: 0;
            color: var(--text-light);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .tip-presets {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .tip-btn {
            flex: 1;
            padding: 6px;
            background: #e2e8f0;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .tip-btn:hover, .tip-btn.active {
            background: var(--primary);
            color: white;
        }

        #calc {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 650;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        #calc:hover {
            background-color: var(--primary-hover);
        }

        #error {
            color: var(--error);
            background-color: var(--error-bg);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 16px;
            display: none;
            text-align: center;
        }

        .result-card {
            margin-top: 24px;
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .result-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 4px;
        }

        #result {
            font-size: 32px;
            font-weight: 800;
            color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🚖 CabSplit</h1>
            <p>Easily split taxi fares, tolls, and tips among friends.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Fare & Tolls ($)</label>
            <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" placeholder="18" value="18" step="1" min="0">
            <div class="tip-presets">
                <button type="button" class="tip-btn" onclick="setTip(10)">10%</button>
                <button type="button" class="tip-btn" onclick="setTip(15)">15%</button>
                <button type="button" class="tip-btn" onclick="setTip(18)" id="default-tip">18%</button>
                <button type="button" class="tip-btn" onclick="setTip(20)">20%</button>
            </div>
        </div>

        <div class="form-group">
            <label for="people">Number of Passengers</label>
            <input type="number" id="people" placeholder="2" value="2" step="1" min="1">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>

        <div class="result-card" id="result-container" style="display: none;">
            <div class="result-title">Amount Per Person</div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        function setTip(val) {
            document.getElementById('tip').value = val;
            document.querySelectorAll('.tip-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            const resultContainer = document.getElementById('result-container');

            // Reset display states
            errorEl.style.display = 'none';
            errorEl.textContent = '';
            resultEl.textContent = '';
            resultContainer.style.display = 'none';

            // Validation checks
            const bill = parseFloat(billInput);
            const tip = parseFloat(tipInput);
            const people = parseInt(peopleInput, 10);

            if (billInput === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid total fare amount.');
                return;
            }

            if (tipInput === '' || isNaN(tip) || tip < 0) {
                showError('Please enter a valid tip percentage.');
                return;
            }

            if (peopleInput === '' || isNaN(people) || people < 1 || !Number.isInteger(people)) {
                showError('Please enter a valid number of passengers (at least 1).');
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalWithTip = bill + tipAmount;
            const perPerson = totalWithTip / people;

            // Output
            resultEl.textContent = `$${perPerson.toFixed(2)}`;
            resultContainer.style.display = 'block';
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
