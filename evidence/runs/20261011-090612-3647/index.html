<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrunchSplit - Effortless Bill & Tip Splitting</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --bg: #fffbeb;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.1), 0 8px 10px -6px rgba(245, 158, 11, 0.1);
            padding: 2.5rem;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        p.pitch {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix, .suffix {
            position: absolute;
            color: var(--text-light);
            font-weight: 500;
            pointer-events: none;
        }

        .prefix {
            left: 1rem;
        }

        .suffix {
            right: 1rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1.5px solid var(--border);
            border-radius: 0.75rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafafa;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
            background: #ffffff;
        }

        .input-wrapper.has-prefix input {
            padding-left: 2.25rem;
        }

        .input-wrapper.has-suffix input {
            padding-right: 2.25rem;
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .tip-btn {
            padding: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            border: 1.5px solid var(--border);
            background: #fafafa;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tip-btn:hover {
            border-color: var(--primary);
            color: var(--primary-dark);
        }

        .tip-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        button#calc {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        button#calc:hover {
            background: var(--primary-dark);
        }

        button#calc:active {
            transform: scale(0.98);
        }

        #error {
            margin-top: 1.25rem;
            padding: 0.875rem;
            background-color: var(--error-bg);
            color: var(--error);
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: var(--bg);
            border-radius: 0.75rem;
            text-align: center;
            border: 1px dashed var(--primary);
            display: none;
        }

        .result-label {
            font-size: 0.875rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">🥞</div>
            <h1>BrunchSplit</h1>
            <p class="pitch">Split brunch bills effortlessly and calculate the perfect tip for your group.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Total Bill Amount</label>
                <div class="input-wrapper has-prefix">
                    <span class="prefix">$</span>
                    <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>

            <div class="form-group">
                <label>Quick Tip Selection</label>
                <div class="tip-buttons">
                    <button type="button" class="tip-btn" data-tip="15">15%</button>
                    <button type="button" class="tip-btn" data-tip="18">18%</button>
                    <button type="button" class="tip-btn" data-tip="20">20%</button>
                    <button type="button" class="tip-btn" data-tip="25">25%</button>
                </div>
                <div class="input-wrapper has-suffix">
                    <input type="number" id="tip" placeholder="Custom Tip" value="18" min="0" step="1">
                    <span class="suffix">%</span>
                </div>
            </div>

            <div class="form-group">
                <label for="people">Number of People</label>
                <div class="input-wrapper">
                    <input type="number" id="people" placeholder="1" value="1" min="1" step="1">
                </div>
            </div>

            <button id="calc">Calculate Split</button>

            <div id="error"></div>
            <div id="result">
                <div class="result-label">Amount Per Person</div>
                <div class="result-value" id="result-value-text">$0.00</div>
            </div>
        </main>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const tipInput = document.getElementById('tip');
        const peopleInput = document.getElementById('people');
        const calcBtn = document.getElementById('calc');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const resultValueText = document.getElementById('result-value-text');
        const tipButtons = document.querySelectorAll('.tip-btn');

        function updateTipButtonsActiveState() {
            const currentTip = tipInput.value.trim();
            tipButtons.forEach(btn => {
                if (btn.getAttribute('data-tip') === currentTip) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        tipButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tipInput.value = btn.getAttribute('data-tip');
                updateTipButtonsActiveState();
            });
        });

        tipInput.addEventListener('input', updateTipButtonsActiveState);
        updateTipButtonsActiveState();

        calcBtn.addEventListener('click', () => {
            const billVal = billInput.value.trim();
            const tipVal = tipInput.value.trim();
            const peopleVal = peopleInput.value.trim();

            const bill = parseFloat(billVal);
            const tip = parseFloat(tipVal);
            const peopleNum = Number(peopleVal);

            // Validation checks
            if (billVal === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid bill amount.');
                return;
            }

            if (tipVal === '' || isNaN(tip) || tip < 0) {
                showError('Please enter a valid tip percentage.');
                return;
            }

            if (peopleVal === '' || isNaN(peopleNum) || !Number.isInteger(peopleNum) || peopleNum <= 0) {
                showError('Please enter a valid whole number of people (at least 1).');
                return;
            }

            // Calculation
            hideError();
            const totalTipAmount = bill * (tip / 100);
            const totalWithTip = bill + totalTipAmount;
            const perPerson = totalWithTip / peopleNum;

            resultValueText.textContent = `$${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            resultDiv.style.display = 'none';
            resultValueText.textContent = '';
        }

        function hideError() {
            errorDiv.textContent = '';
            errorDiv.style.display = 'none';
        }
    </script>
</body>
</html>
