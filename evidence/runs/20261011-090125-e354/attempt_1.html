<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillSplit - Tip & Bill Calculator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #cbd5e1;
            --error: #dc2626;
            --error-bg: #fee2e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        p.pitch {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .quick-tips {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .tip-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tip-btn:hover, .tip-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        button#calc {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button#calc:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        #result {
            margin-top: 1.5rem;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            display: none;
        }

        #result .label {
            font-size: 0.875rem;
            color: #166534;
            margin-bottom: 0.25rem;
        }

        #result .amount {
            font-size: 2rem;
            font-weight: 700;
            color: #15803d;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BillSplit</h1>
            <p class="pitch">The easiest way for friends to calculate tips and split restaurant bills fairly.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Bill Total ($)</label>
                <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="tip">Tip Percentage (%)</label>
                <input type="number" id="tip" step="1" min="0" placeholder="15">
                <div class="quick-tips">
                    <button type="button" class="tip-btn" onclick="setTip(10)">10%</button>
                    <button type="button" class="tip-btn" onclick="setTip(15)">15%</button>
                    <button type="button" class="tip-btn" onclick="setTip(18)">18%</button>
                    <button type="button" class="tip-btn" onclick="setTip(20)">20%</button>
                </div>
            </div>

            <div class="form-group">
                <label for="people">Number of People</label>
                <input type="number" id="people" step="1" min="1" placeholder="1" value="1">
            </div>

            <button id="calc">Calculate Split</button>

            <div id="error"></div>
            <div id="result">
                <div class="label">Amount Per Person</div>
                <div class="amount" id="result-amount">$0.00</div>
            </div>
        </main>
    </div>

    <script>
        function setTip(val) {
            document.getElementById('tip').value = val;
            // Update active state on quick buttons
            document.querySelectorAll('.tip-btn').forEach(btn => {
                if (parseInt(btn.innerText) === val) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();

            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            const resultAmountEl = document.getElementById('result-amount');

            // Reset states
            errorEl.style.display = 'none';
            errorEl.innerText = '';
            resultEl.style.display = 'none';

            // Validation checks
            const bill = parseFloat(billInput);
            const tip = tipInput === '' ? 0 : parseFloat(tipInput);
            const people = parseInt(peopleInput, 10);

            if (billInput === '' || isNaN(bill) || bill < 0) {
                showError("Please enter a valid bill total.");
                return;
            }

            if (tipInput !== '' && (isNaN(tip) || tip < 0)) {
                showError("Please enter a valid tip percentage.");
                return;
            }

            if (peopleInput === '' || isNaN(people) || people <= 0 || !Number.isInteger(people)) {
                showError("Please enter a valid whole number of people (at least 1).");
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalBill = bill + tipAmount;
            const perPerson = totalBill / people;

            // Display results
            resultAmountEl.innerText = `$${perPerson.toFixed(2)}`;
            resultEl.style.display = 'block';
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.innerText = message;
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
