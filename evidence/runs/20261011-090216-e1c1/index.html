<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabSplit - Airport Ride Fare & Tip Splitter</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --text-light: #64748b;
            --error-bg: #fef2f2;
            --error-text: #dc2626;
            --success-bg: #f0fdf4;
            --success-text: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
        }

        .header p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-light);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix, .suffix {
            position: absolute;
            color: var(--text-light);
            font-size: 1rem;
        }

        .prefix {
            left: 1rem;
        }

        .suffix {
            right: 1rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fff;
        }

        input.has-prefix {
            padding-left: 2rem;
        }

        input.has-suffix {
            padding-right: 2rem;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        #result {
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>CabSplit</h1>
            <p>Effortlessly split taxi fares and tips among groups sharing an airport ride.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Fare ($)</label>
            <div class="input-wrapper">
                <span class="prefix">$</span>
                <input type="number" id="bill" class="has-prefix" placeholder="0.00" step="0.01" min="0">
            </div>
        </div>

        <div class="form-group">
            <label for="tip">Driver Tip (%)</label>
            <div class="input-wrapper">
                <input type="number" id="tip" class="has-suffix" placeholder="15" step="1" min="0" value="15">
                <span class="suffix">%</span>
            </div>
        </div>

        <div class="form-group">
            <label for="people">Number of Passengers</label>
            <div class="input-wrapper">
                <input type="number" id="people" placeholder="1" step="1" min="1" value="1">
            </div>
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value;
            const tipInput = document.getElementById('tip').value;
            const peopleInput = document.getElementById('people').value;

            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');

            // Reset display states
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';
            errorEl.textContent = '';
            resultEl.textContent = '';

            // Parse values
            const bill = parseFloat(billInput);
            const tip = parseFloat(tipInput);
            const people = parseFloat(peopleInput);

            // Validation checks
            if (billInput.trim() === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid fare amount (0 or greater).');
                return;
            }

            if (tipInput.trim() === '' || isNaN(tip) || tip < 0) {
                showError('Please enter a valid tip percentage (0 or greater).');
                return;
            }

            if (peopleInput.trim() === '' || isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Please enter a valid whole number of passengers greater than zero.');
                return;
            }

            // Calculation
            const totalTipAmount = bill * (tip / 100);
            const totalAmount = bill + totalTipAmount;
            const perPersonAmount = totalAmount / people;

            // Display valid output
            resultEl.textContent = `Each person pays: $${perPersonAmount.toFixed(2)}`;
            resultEl.style.display = 'block';
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
