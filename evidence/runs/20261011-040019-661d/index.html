<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabMate - Bar Tab & Coworker Drink Splitter</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --error: #dc2626;
            --border: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.25rem;
            color: var(--text);
            text-align: center;
        }

        .pitch {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            min-height: 1.25rem;
            font-weight: 500;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #eff6ff;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TabMate</h1>
        <div class="pitch">Effortlessly split bar tabs and calculate coworker drinks after a night out.</div>

        <div class="form-group">
            <label for="bill">Total Bill Amount ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" min="1" placeholder="1">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" min="0" placeholder="20">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        const calcButton = document.getElementById('calc');
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');

        calcButton.addEventListener('click', () => {
            // Reset outputs
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';

            const billVal = parseFloat(billInput.value);
            const peopleVal = parseInt(peopleInput.value, 10);
            const tipVal = parseFloat(tipInput.value);

            // Validation checks
            if (isNaN(billVal) || billVal < 0) {
                errorDiv.textContent = 'Please enter a valid positive bill amount.';
                return;
            }
            if (isNaN(peopleVal) || peopleVal <= 0 || !Number.isInteger(peopleVal)) {
                errorDiv.textContent = 'Number of people must be a whole number greater than zero.';
                return;
            }
            if (isNaN(tipVal) || tipVal < 0) {
                errorDiv.textContent = 'Please enter a valid tip percentage (0 or more).';
                return;
            }

            // Calculation logic
            const tipAmount = billVal * (tipVal / 100);
            const totalAmount = billVal + tipAmount;
            const perPerson = totalAmount / peopleVal;

            // Display result with two decimals
            resultDiv.textContent = `Per Person: $${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
