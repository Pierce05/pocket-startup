<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillSplit - Instant Tip & Bill Splitter</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --error-bg: #451a03;
            --error-text: #fca5a5;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        p.pitch {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5srem;
            margin-bottom: 0.35rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.75rem 0.75rem 0.75rem 2rem;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input.no-prefix {
            padding-left: 0.75rem;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: var(--bg-color);
            border: none;
            border-radius: 0.5rem;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-text);
            border: 1px solid #78350f;
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-size: 0.875rem;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        #result {
            margin-top: 1.5rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.25rem;
            text-align: center;
            display: none;
        }

        .result-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .result-amount {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BillSplit</h1>
            <p class="pitch">Calculate tips and split restaurant bills instantly.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Bill Amount</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="tip">Tip Percentage</label>
                <div class="input-wrapper">
                    <input type="number" id="tip" class="no-prefix" placeholder="15" value="15" min="0" step="0.1">
                    <span class="prefix" style="left: auto; right: 0.75rem;">%</span>
                </div>
            </div>

            <div class="form-group">
                <label for="people">Number of People</label>
                <div class="input-wrapper">
                    <input type="number" id="people" class="no-prefix" placeholder="1" value="1" min="1" step="1">
                </div>
            </div>

            <button id="calc">Calculate Split</button>

            <div id="error"></div>
            <div id="result">
                <div class="result-label">Amount Per Person</div>
                <div id="result-amount" class="result-amount">$0.00</div>
            </div>
        </main>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const tipInput = document.getElementById('tip');
        const peopleInput = document.getElementById('people');
        const calcBtn = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const resultAmount = document.getElementById('result-amount');
        const errorDiv = document.getElementById('error');

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            resultDiv.style.display = 'none';
        }

        function showResult(amount) {
            errorDiv.style.display = 'none';
            resultAmount.textContent = `$${amount}`;
            resultDiv.style.display = 'block';
        }

        calcBtn.addEventListener('click', () => {
            const billVal = billInput.value.trim();
            const tipVal = tipInput.value.trim();
            const peopleVal = peopleInput.value.trim();

            // Check empty inputs
            if (billVal === '' || peopleVal === '') {
                showError('Please enter a bill amount and number of people.');
                return;
            }

            const bill = parseFloat(billVal);
            const tipPct = tipVal === '' ? 0 : parseFloat(tipVal);
            const people = parseInt(peopleVal, 10);

            // Validation checks
            if (isNaN(bill) || isNaN(tipPct) || isNaN(people)) {
                showError('Please enter valid numeric values.');
                return;
            }

            if (bill < 0) {
                showError('Bill amount cannot be negative.');
                return;
            }

            if (tipPct < 0) {
                showError('Tip percentage cannot be negative.');
                return;
            }

            if (people <= 0) {
                showError('Number of people must be at least 1.');
                return;
            }

            // Calculation
            const tipAmount = bill * (tipPct / 100);
            const totalBill = bill + tipAmount;
            const perPerson = totalBill / people;

            showResult(perPerson.toFixed(2));
        });
    </script>
</body>
</html>
