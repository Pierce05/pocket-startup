<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabShare Splitter</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --bg: #1e293b;
            --card-bg: #0f172a;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        p.pitch {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        #error {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 16px;
            text-align: center;
            min-height: 20px;
        }

        #result {
            margin-top: 20px;
            padding: 16px;
            background-color: var(--bg);
            border-radius: 8px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
            border: 1px dashed var(--border);
            display: none;
        }

        .result-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚖 CabShare Splitter</h1>
        <p class="pitch">Easily split taxi fares and tips among friends after a group airport ride.</p>

        <div class="input-group">
            <label for="bill">Metered Fare Amount ($)</label>
            <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
        </div>

        <div class="input-group">
            <label for="people">Number of Passengers</label>
            <input type="number" id="people" placeholder="1" min="1" step="1">
        </div>

        <div class="input-group">
            <label for="tip">Driver Gratuity (%)</label>
            <input type="number" id="tip" placeholder="15" value="15" min="0" step="1">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result">
            <span class="result-label">Per Person Share</span>
            <span id="result-amount">$0.00</span>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const calcBtn = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const resultAmountSpan = document.getElementById('result-amount');
        const errorDiv = document.getElementById('error');

        calcBtn.addEventListener('click', () => {
            const rawPeople = peopleInput.value;
            const billVal = parseFloat(billInput.value);
            const peopleVal = Number(rawPeople);
            const tipVal = parseFloat(tipInput.value);

            // Validation checks
            if (isNaN(billVal) || billVal < 0) {
                showError('Please enter a valid metered fare amount.');
                return;
            }

            if (rawPeople.trim() === '' || isNaN(peopleVal) || peopleVal <= 0 || !Number.isInteger(peopleVal)) {
                showError('Please enter a valid number of passengers (at least 1 whole person).');
                return;
            }

            if (isNaN(tipVal) || tipVal < 0) {
                showError('Please enter a valid tip percentage.');
                return;
            }

            // Clear errors and calculate
            errorDiv.textContent = '';
            
            const tipMultiplier = 1 + (tipVal / 100);
            const totalAmount = billVal * tipMultiplier;
            const perPerson = totalAmount / peopleVal;

            resultAmountSpan.textContent = `$${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            resultDiv.style.display = 'none';
        }
    </script>
</body>
</html>
