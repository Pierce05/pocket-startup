<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingTab - Wedding Dinner Bill Splitter</title>
    <style>
        :root {
            --primary: #2c4a3e;
            --accent: #d4af37;
            --bg: #f9f8f6;
            --card-bg: #ffffff;
            --text: #333333;
            --error: #a94442;
            --error-bg: #f2dede;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(44, 74, 62, 0.08);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            box-sizing: border-box;
            border-top: 4px solid var(--accent);
        }

        h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .pitch {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        button:hover {
            background-color: #1e332a;
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        #result {
            background-color: #f0f4f1;
            border: 1px solid #d8e2d9;
            color: var(--primary);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }

        .result-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: #557065;
        }

        .result-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WeddingTab</h1>
        <div class="pitch">Split wedding dinner bills and service charges effortlessly among guests.</div>

        <div class="input-group">
            <label for="bill">Table Total Bill ($)</label>
            <input type="number" id="bill" placeholder="e.g. 250.00" step="0.01" min="0">
        </div>

        <div class="input-group">
            <label for="people">Number of Guests</label>
            <input type="number" id="people" placeholder="e.g. 4" step="1" min="1">
        </div>

        <div class="input-group">
            <label for="tip">Service Charge / Tip (%)</label>
            <input type="number" id="tip" placeholder="e.g. 18" step="0.1" min="0" value="18">
        </div>

        <button id="calc">Calculate Share</button>

        <div id="error"></div>
        
        <div id="result">
            <div class="result-label">Amount Per Guest</div>
            <div id="result-amount" class="result-value">$0.00</div>
        </div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            const tipInput = document.getElementById('tip').value.trim();

            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            const resultAmountEl = document.getElementById('result-amount');

            // Reset display states
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';
            errorEl.textContent = '';
            resultAmountEl.textContent = '$0.00';

            // Parse values
            const bill = parseFloat(billInput);
            const peopleFloat = parseFloat(peopleInput);
            const people = parseInt(peopleInput, 10);
            const tip = tipInput === '' ? 0 : parseFloat(tipInput);

            // Validation logic
            if (billInput === '' || peopleInput === '') {
                errorEl.textContent = 'Please enter both the table bill total and the number of guests.';
                errorEl.style.display = 'block';
                return;
            }

            if (isNaN(bill) || isNaN(peopleFloat) || isNaN(tip)) {
                errorEl.textContent = 'Please enter valid numerical values for all fields.';
                errorEl.style.display = 'block';
                return;
            }

            if (bill < 0) {
                errorEl.textContent = 'The bill amount cannot be negative.';
                errorEl.style.display = 'block';
                return;
            }

            if (people <= 0 || !Number.isInteger(peopleFloat)) {
                errorEl.textContent = 'The number of guests must be a whole number greater than zero.';
                errorEl.style.display = 'block';
                return;
            }

            if (tip < 0) {
                errorEl.textContent = 'The service charge percentage cannot be negative.';
                errorEl.style.display = 'block';
                return;
            }

            // Calculation
            const totalWithTip = bill * (1 + tip / 100);
            const perPerson = totalWithTip / people;

            // Output result
            resultAmountEl.textContent = '$' + perPerson.toFixed(2);
            resultEl.style.display = 'block';
        });
    </script>
</body>
</html>
