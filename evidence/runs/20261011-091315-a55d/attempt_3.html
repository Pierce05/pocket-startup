<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalonPool Tips</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --error: #dc2626;
            --error-bg: #fee2e2;
            --success-bg: #f0fdf4;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .header p {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            display: none;
            background-color: var(--error-bg);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
        }

        #result {
            display: none;
            background-color: var(--success-bg);
            color: #166534;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 1.125rem;
            font-weight: 700;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>SalonPool Tips</h1>
            <p>Easily split and distribute pooled tips among salon team members.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Service Bill ($)</label>
            <input type="number" id="bill" step="0.01" min="0" value="150">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="any" min="0" value="20">
        </div>

        <div class="form-group">
            <label for="people">Number of Team Members</label>
            <input type="number" id="people" step="1" min="1" value="1">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');

            // Reset display states
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';
            errorEl.textContent = '';
            resultEl.textContent = '';

            // Parse inputs
            const bill = Number(billInput);
            const tip = Number(tipInput);
            const people = Number(peopleInput);

            // Validation checks
            if (billInput === '' || tipInput === '' || peopleInput === '') {
                errorEl.textContent = 'Please fill out all fields.';
                errorEl.style.display = 'block';
                return;
            }

            if (isNaN(bill) || bill < 0) {
                errorEl.textContent = 'Bill must be a valid number greater than or equal to 0.';
                errorEl.style.display = 'block';
                return;
            }

            if (isNaN(tip) || tip < 0) {
                errorEl.textContent = 'Tip percentage must be a valid number greater than or equal to 0.';
                errorEl.style.display = 'block';
                return;
            }

            if (!Number.isInteger(people) || people <= 0) {
                errorEl.textContent = 'Number of people must be a whole number greater than zero.';
                errorEl.style.display = 'block';
                return;
            }

            // Calculation
            const totalTip = bill * (tip / 100);
            const perPerson = totalTip / people;

            // Display result matching exact expected format or value
            resultEl.textContent = perPerson.toFixed(2);
            resultEl.style.display = 'block';
        });
    </script>
</body>
</html>
