<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalonPool Splitter</title>
    <style>
        :root {
            --primary: #d946ef;
            --primary-hover: #c026d3;
            --bg: #fdf4ff;
            --card-bg: #ffffff;
            --text: #1f2937;
            --error: #ef4444;
            --border: #f5d0fe;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(217, 70, 239, 0.1), 0 8px 10px -6px rgba(217, 70, 239, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: #86198f;
            text-align: center;
        }

        p.pitch {
            font-size: 0.875rem;
            color: #6b7280;
            text-align: center;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
            color: #4b5563;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(217, 70, 239, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        #error {
            color: var(--error);
            font-size: 0.875rem;
            text-align: center;
            margin-top: 1rem;
            min-height: 1.25rem;
        }

        #result {
            margin-top: 1.5rem;
            background-color: #fdf4ff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: #86198f;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SalonPool Splitter</h1>
        <p class="pitch">Easily divide shared tips among the salon team based on hours worked and services.</p>

        <div class="input-group">
            <label for="bill">Total Service Bill ($)</label>
            <input type="number" id="bill" step="0.01" placeholder="e.g. 150.00">
        </div>

        <div class="input-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="0.1" placeholder="e.g. 20">
        </div>

        <div class="input-group">
            <label for="people">Number of Staff Members</label>
            <input type="number" id="people" step="1" placeholder="e.g. 3">
        </div>

        <button id="calc">Calculate Pool Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');

            errorEl.textContent = '';
            resultEl.style.display = 'none';
            resultEl.textContent = '';

            // Check for empty fields
            if (billInput === '' || tipInput === '' || peopleInput === '') {
                errorEl.textContent = 'Please fill out all fields.';
                return;
            }

            const bill = Number(billInput);
            const tip = Number(tipInput);
            const people = Number(peopleInput);

            // Validate numeric values and constraints
            if (isNaN(bill) || bill < 0) {
                errorEl.textContent = 'Bill must be a valid number greater than or equal to 0.';
                return;
            }

            if (isNaN(tip) || tip < 0) {
                errorEl.textContent = 'Tip percentage must be a valid number greater than or equal to 0.';
                return;
            }

            if (isNaN(people) || !Number.isInteger(people) || people <= 0) {
                errorEl.textContent = 'Number of staff members must be a whole integer greater than 0.';
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalAmount = bill + tipAmount;
            const perPerson = totalAmount / people;

            // Display Result
            resultEl.textContent = `Per Person: $${perPerson.toFixed(2)}`;
            resultEl.style.display = 'block';
        });
    </script>
</body>
</html>
