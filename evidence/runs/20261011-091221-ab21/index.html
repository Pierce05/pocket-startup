<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeRun Splitter</title>
    <style>
        :root {
            --primary: #6F4E37;
            --primary-hover: #5a3d2b;
            --bg: #fdfbf7;
            --card-bg: #ffffff;
            --text: #2c221e;
            --error-bg: #fde8e8;
            --error-text: #9b1c1c;
            --border: #e3dcd2;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(111, 78, 55, 0.08);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--primary);
            text-align: center;
        }

        .pitch {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a3b32;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        #result {
            background-color: #f4efe6;
            border-radius: 6px;
            padding: 16px;
            margin-top: 16px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>☕ CoffeeRun Splitter</h1>
        <div class="pitch">Quickly calculate and split tips for office coffee runs among the team.</div>

        <div class="input-group">
            <label for="bill">Total Bill ($)</label>
            <input type="number" id="bill" step="0.01" placeholder="e.g., 24.50">
        </div>

        <div class="input-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" placeholder="e.g., 18">
        </div>

        <div class="input-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" step="1" placeholder="e.g., 3">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const tipInput = document.getElementById('tip');
        const peopleInput = document.getElementById('people');
        const calcButton = document.getElementById('calc');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');

        calcButton.addEventListener('click', () => {
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.textContent = '';

            const billVal = billInput.value.trim();
            const tipVal = tipInput.value.trim();
            const peopleVal = peopleInput.value.trim();

            if (billVal === '' || tipVal === '' || peopleVal === '') {
                showError('Please fill out all fields.');
                return;
            }

            const bill = Number(billVal);
            const tip = Number(tipVal);
            const people = Number(peopleVal);

            // Validation: bill >= 0, tip >= 0, people whole number > 0
            if (isNaN(bill) || bill < 0) {
                showError('Bill amount must be zero or greater.');
                return;
            }

            if (isNaN(tip) || tip < 0) {
                showError('Tip percentage must be zero or greater.');
                return;
            }

            if (isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Number of people must be a whole number greater than zero.');
                return;
            }

            const total = bill * (1 + tip / 100);
            const perPerson = total / people;

            resultDiv.textContent = `Per Person: $${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
