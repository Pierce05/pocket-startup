<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingTab - Wedding Dinner Bill Splitter</title>
    <style>
        :root {
            --primary: #8a4af3;
            --primary-light: #f3efff;
            --accent: #d4af37;
            --text: #333333;
            --error: #d93838;
            --bg: #f9f8fc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(138, 74, 243, 0.1);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border-top: 5px solid var(--accent);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--primary);
            text-align: center;
        }

        .pitch {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #7639e0;
        }

        #error {
            color: var(--error);
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }

        #result {
            margin-top: 20px;
            padding: 16px;
            background-color: var(--primary-light);
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
            display: none;
        }

        .currency-symbol {
            position: relative;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WeddingTab 🥂</h1>
        <div class="pitch">Split wedding dinner bills and service charges effortlessly among guests.</div>

        <div class="form-group">
            <label for="bill">Total Bill Amount ($)</label>
            <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
        </div>

        <div class="form-group">
            <label for="people">Number of Guests</label>
            <input type="number" id="people" placeholder="1" step="1" min="1">
        </div>

        <div class="form-group">
            <label for="tip">Service Charge / Tip (%)</label>
            <input type="number" id="tip" placeholder="18" step="0.1" min="0" value="18">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');

            // Reset outputs
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';

            // Parse values
            const bill = parseFloat(billInput);
            const people = parseInt(peopleInput, 10);
            const tip = parseFloat(tipInput);

            // Validation
            if (billInput === '' || peopleInput === '' || tipInput === '') {
                errorDiv.textContent = 'Please fill in all fields.';
                return;
            }

            if (isNaN(bill) || isNaN(people) || isNaN(tip) || bill < 0 || people <= 0 || tip < 0) {
                errorDiv.textContent = 'Please enter valid positive numbers (guests must be at least 1).';
                return;
            }

            if (!Number.isInteger(people)) {
                errorDiv.textContent = 'Number of guests must be a whole number.';
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalAmount = bill + tipAmount;
            const perPerson = totalAmount / people;

            // Display results
            resultDiv.textContent = `Each guest owes: $${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });
    </script>

</body>
</html>
