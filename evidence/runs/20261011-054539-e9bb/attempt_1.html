<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BillSplit</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --error-bg: #fee2e2;
    --error-text: #991b1b;
    --border: #cbd5e1;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }

  .container {
    background-color: var(--card);
    width: 100%;
    max-width: 400px;
    padding: 2rem;
    border-radius: 1rem;
    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    text-align: center;
    color: var(--primary);
  }

  .pitch {
    font-size: 0.875rem;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .form-group {
    margin-bottom: 1rem;
  }

  label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 0.375rem;
  }

  input {
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
  }

  button {
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    font-weight: 600;
    color: #ffffff;
    background-color: var(--primary);
    border: none;
    border-radius: 0.5rem;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: background-color 0.2s;
  }

  button:hover {
    background-color: var(--primary-hover);
  }

  #error {
    margin-top: 1rem;
    padding: 0.75rem;
    background-color: var(--error-bg);
    color: var(--error-text);
    border-radius: 0.5rem;
    font-size: 0.875rem;
    text-align: center;
    display: none;
  }

  #result {
    margin-top: 1.5rem;
    padding: 1rem;
    background-color: #f1f5f9;
    border-radius: 0.5rem;
    text-align: center;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--primary);
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <h1>BillSplit</h1>
  <p class="pitch">Easily split restaurant bills and calculate tips with friends in seconds.</p>
  
  <div class="form-group">
    <label for="bill">Bill Amount ($)</label>
    <input type="number" id="bill" step="0.01" placeholder="0.00">
  </div>

  <div class="form-group">
    <label for="tip">Tip Percentage (%)</label>
    <input type="number" id="tip" step="1" placeholder="15">
  </div>

  <div class="form-group">
    <label for="people">Number of People</label>
    <input type="number" id="people" step="1" placeholder="1">
  </div>

  <button id="calc">Calculate Split</button>

  <div id="error"></div>
  <div id="result"></div>
</div>

<script>
  document.getElementById('calc').addEventListener('click', function() {
    const billInput = document.getElementById('bill').value;
    const tipInput = document.getElementById('tip').value;
    const peopleInput = document.getElementById('people').value;
    
    const errorEl = document.getElementById('error');
    const resultEl = document.getElementById('result');

    // Reset displays
    errorEl.style.display = 'none';
    errorEl.textContent = '';
    resultEl.style.display = 'none';
    resultEl.textContent = '';

    // Parse inputs
    const bill = parseFloat(billInput);
    const tip = parseFloat(tipInput);
    const peopleNum = Number(peopleInput);

    // Validation checks
    let errorMessage = '';

    if (billInput === '' || isNaN(bill) || bill < 0) {
      errorMessage = 'Please enter a valid bill amount (0 or greater).';
    } else if (tipInput === '' || isNaN(tip) || tip < 0) {
      errorMessage = 'Please enter a valid tip percentage (0 or greater).';
    } else if (peopleInput === '' || isNaN(peopleNum) || !Number.isInteger(peopleNum) || peopleNum <= 0) {
      errorMessage = 'Please enter a whole number of people greater than zero.';
    }

    if (errorMessage) {
      errorEl.textContent = errorMessage;
      errorEl.style.display = 'block';
      return;
    }

    // Computation
    const totalTip = bill * (tip / 100);
    const totalAmount = bill + totalTip;
    const perPerson = totalAmount / peopleNum;

    resultEl.textContent = `Per Person: $${perPerson.toFixed(2)}`;
    resultEl.style.display = 'block';
  });
</script>

</body>
</html>
