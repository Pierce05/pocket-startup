<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabSplitter Coworker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --success-bg: #ecfdf5;
            --success-text: #047857;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--text);
            text-align: center;
        }

        .pitch {
            color: var(--text-light);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        #result {
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 16px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TabSplitter Coworker</h1>
        <div class="pitch">Easily split bar tabs and calculate coworker tips after a night out.</div>

        <div class="form-group">
            <label for="bill">Bar Tab Amount ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="people">Number of Coworkers</label>
            <input type="number" id="people" min="1" step="1" placeholder="1">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" min="0" placeholder="20" value="20">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        const calcBtn = document.getElementById('calc');
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');

        calcBtn.addEventListener('click', () => {
            const billVal = parseFloat(billInput.value);
            const peopleVal = parseInt(peopleInput.value, 10);
            const tipVal = parseFloat(tipInput.value);

            // Validation checks
            if (isNaN(billVal) || billVal < 0) {
                showError("Please enter a valid, non-negative bar tab amount.");
                return;
            }

            if (isNaN(peopleVal) || peopleVal <= 0 || !Number.isInteger(peopleVal)) {
                showError("Please enter a valid number of coworkers (at least 1).");
                return;
            }

            if (isNaN(tipVal) || tipVal < 0) {
                showError("Please enter a valid, non-negative tip percentage.");
                return;
            }

            // Calculation
            const tipAmount = billVal * (tipVal / 100);
            const totalBill = billVal + tipAmount;
            const perPerson = totalBill / peopleVal;

            // Display results
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'block';
            resultDiv.textContent = `Each coworker owes: $${perPerson.toFixed(2)}`;
        });

        function showError(message) {
            resultDiv.style.display = 'none';
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
