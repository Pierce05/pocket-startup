<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingTab - Wedding Dinner Bill Splitter</title>
    <style>
        :root {
            --primary: #831843;
            --primary-light: #fce7f3;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --bg-color: #fff1f2;
            --card-bg: #ffffff;
            --error-color: #991b1b;
            --error-bg: #fee2e2;
            --success-bg: #fdf2f8;
            --border-color: #fbcfe8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(131, 24, 67, 0.08);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: #701a3d;
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-color);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        #result {
            background-color: var(--success-bg);
            border: 1px solid var(--border-color);
            color: var(--primary);
            padding: 1.25rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        #result .label {
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        #result .amount {
            font-size: 2rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>WeddingTab</h1>
            <p>Easily split wedding dinner bills and custom service charges among guests.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Bill Amount ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="e.g. 250.00">
        </div>

        <div class="form-group">
            <label for="people">Number of Guests</label>
            <input type="number" id="people" step="1" min="1" placeholder="e.g. 4">
        </div>

        <div class="form-group">
            <label for="tip">Service Charge / Tip (%)</label>
            <input type="number" id="tip" step="0.1" min="0" placeholder="e.g. 18">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result">
            <div class="label">Amount Per Person</div>
            <div id="result-amount" class="amount">$0.00</div>
        </div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            const resultAmountEl = document.getElementById('result-amount');

            // Reset views
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';
            resultAmountEl.textContent = '';

            // Validate inputs are not empty
            if (billInput === '' || peopleInput === '' || tipInput === '') {
                showError("Please fill out all fields.");
                return;
            }

            const bill = Number(billInput);
            const people = Number(peopleInput);
            const tip = Number(tipInput);

            // Validation checks
            if (isNaN(bill) || bill < 0) {
                showError("Please enter a valid non-negative number for the bill.");
                return;
            }

            if (isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError("Please enter a valid whole number greater than 0 for the number of people.");
                return;
            }

            if (isNaN(tip) || tip < 0) {
                showError("Please enter a valid non-negative number for the tip/service charge percentage.");
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalSum = bill + tipAmount;
            const perPerson = totalSum / people;

            // Display results
            resultAmountEl.textContent = `$${perPerson.toFixed(2)}`;
            resultEl.style.display = 'block';
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
