<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrunchSplit</title>
    <style>
        :root {
            --primary: #f97316;
            --primary-hover: #ea580c;
            --bg: #fff7ed;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --error: #dc2626;
            --error-bg: #fee2e2;
            --border: #fed7aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.1), 0 8px 10px -6px rgba(249, 115, 22, 0.1);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .header p {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background-color: #ffedd5;
            border-radius: 0.5rem;
            text-align: center;
            display: none;
            border: 1px solid var(--border);
        }

        .result-label {
            font-size: 0.875rem;
            color: #9a3412;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .result-amount {
            font-size: 2.25rem;
            font-weight: 700;
            color: #c2410c;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>BrunchSplit</h1>
            <p>Split brunch bills effortlessly with friends</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Bill ($)</label>
            <input type="number" id="bill" step="0.01" placeholder="0.00" min="0">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" placeholder="18" min="0" value="18">
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" step="1" placeholder="2" min="1" value="2">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result">
            <div class="result-label">Per Person Amount</div>
            <div id="result-amount" class="result-amount">$0.00</div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const calcBtn = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        const resultAmount = document.getElementById('result-amount');

        calcBtn.addEventListener('click', () => {
            const billVal = billInput.value.trim();
            const peopleVal = peopleInput.value.trim();
            const tipVal = tipInput.value.trim();

            // Clear previous states
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';

            // Parse inputs
            const bill = parseFloat(billVal);
            const people = Number(peopleVal);
            const tip = tipVal === '' ? 0 : parseFloat(tipVal);

            // Validation checks
            if (billVal === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid bill amount (0 or greater).');
                return;
            }

            if (tipVal !== '' && (isNaN(tip) || tip < 0)) {
                showError('Please enter a valid tip percentage (0 or greater).');
                return;
            }

            if (peopleVal === '' || isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Please enter a valid whole number of people greater than zero.');
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalBill = bill + tipAmount;
            const perPerson = totalBill / people;

            // Display result
            resultAmount.textContent = `$${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            resultDiv.style.display = 'none';
        }
    </script>
</body>
</html>
