<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabSync Coworker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --error-bg: #fef2f2;
            --error-text: #991b1b;
            --success-bg: #f0fdf4;
            --success-text: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        p.pitch {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: var(--error-bg);
            color: var(--error-text);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            display: none;
            text-align: center;
        }

        #result {
            margin-top: 1rem;
            padding: 1rem;
            background-color: var(--success-bg);
            color: var(--success-text);
            border-radius: 0.5rem;
            font-size: 1.125rem;
            font-weight: 700;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TabSync Coworker</h1>
            <p class="pitch">Effortlessly split bar tabs and calculate coworker tips after a night out.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Total Bill Amount ($)</label>
                <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
            </div>

            <div class="form-group">
                <label for="people">Number of People</label>
                <input type="number" id="people" placeholder="1" step="1" min="1">
            </div>

            <div class="form-group">
                <label for="tip">Tip Percentage (%)</label>
                <input type="number" id="tip" placeholder="18" step="0.1" min="0" value="18">
            </div>

            <button id="calc">Calculate Split</button>

            <div id="error"></div>
            <div id="result"></div>
        </main>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const calcButton = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');

        calcButton.addEventListener('click', () => {
            const billVal = billInput.value.trim();
            const peopleVal = peopleInput.value.trim();
            const tipVal = tipInput.value.trim();

            // Clear previous states
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';

            // Validation checks
            if (billVal === '' || peopleVal === '' || tipVal === '') {
                showError('Please fill in all fields.');
                return;
            }

            const bill = Number(billVal);
            const people = Number(peopleVal);
            const tip = Number(tipVal);

            if (isNaN(bill) || bill < 0) {
                showError('Please enter a valid, non-negative bill amount.');
                return;
            }

            if (isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Number of people must be a positive whole integer.');
                return;
            }

            if (isNaN(tip) || tip < 0) {
                showError('Please enter a valid, non-negative tip percentage.');
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalAmount = bill + tipAmount;
            const perPerson = totalAmount / people;

            // Display Result
            resultDiv.textContent = `Per Person: $${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
