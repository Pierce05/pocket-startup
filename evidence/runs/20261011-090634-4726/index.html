<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrunchSplit</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --bg: #fffbeb;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #f3f4f6;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.1), 0 8px 10px -6px rgba(245, 158, 11, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.875rem;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .header p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5srem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 1rem;
            color: var(--text-light);
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.25rem;
            border: 2px solid var(--border);
            border-radius: 0.75rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input#bill {
            padding-left: 2rem;
        }

        input#people, input#tip {
            padding-left: 1rem;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .tip-btn {
            background-color: var(--border);
            border: none;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            color: var(--text);
        }

        .tip-btn:hover, .tip-btn.active {
            background-color: var(--primary);
            color: white;
        }

        button#calc {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button#calc:hover {
            background-color: var(--primary-dark);
        }

        #error {
            background-color: #fee2e2;
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        #result {
            background-color: var(--bg);
            border: 2px dashed var(--primary);
            padding: 1.25rem;
            border-radius: 0.75rem;
            margin-top: 1.25rem;
            text-align: center;
            display: none;
        }

        #result .label {
            font-size: 0.875rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        #result .amount {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>BrunchSplit 🥞</h1>
            <p>Split brunch bills effortlessly and calculate the perfect tip.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Bill ($)</label>
            <div class="input-wrapper">
                <span class="prefix">$</span>
                <input type="number" id="bill" step="0.01" placeholder="0.00" min="0">
            </div>
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" placeholder="18" min="0" value="18">
            <div class="tip-buttons">
                <button type="button" class="tip-btn" data-tip="15">15%</button>
                <button type="button" class="tip-btn" data-tip="18">18%</button>
                <button type="button" class="tip-btn" data-tip="20">20%</button>
                <button type="button" class="tip-btn" data-tip="25">25%</button>
            </div>
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" step="1" placeholder="1" min="1" value="1">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result">
            <div class="label">Per Person</div>
            <div class="amount" id="per-person-amount">$0.00</div>
        </div>
    </div>

    <script>
        const tipButtons = document.querySelectorAll('.tip-btn');
        const tipInput = document.getElementById('tip');
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const calcBtn = document.getElementById('calc');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const amountDiv = document.getElementById('per-person-amount');

        // Handle preset tip buttons
        tipButtons.forEach(btn => {
            if(btn.dataset.tip === tipInput.value) {
                btn.classList.add('active');
            }
            btn.addEventListener('click', () => {
                tipButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tipInput.value = btn.dataset.tip;
            });
        });

        tipInput.addEventListener('input', () => {
            tipButtons.forEach(b => {
                if(b.dataset.tip === tipInput.value) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            });
        });

        calcBtn.addEventListener('click', () => {
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            errorDiv.textContent = '';

            const billVal = billInput.value.trim();
            const tipVal = tipInput.value.trim();
            const peopleVal = peopleInput.value.trim();

            const bill = parseFloat(billVal);
            const tip = parseFloat(tipVal);
            const people = Number(peopleVal);

            // Validation checks
            if (billVal === '' || tipVal === '' || peopleVal === '') {
                errorDiv.textContent = 'Please fill out all fields.';
                errorDiv.style.display = 'block';
                return;
            }

            if (isNaN(bill) || bill < 0) {
                errorDiv.textContent = 'Please enter a valid bill amount greater than or equal to 0.';
                errorDiv.style.display = 'block';
                return;
            }

            if (isNaN(tip) || tip < 0) {
                errorDiv.textContent = 'Please enter a valid tip percentage greater than or equal to 0.';
                errorDiv.style.display = 'block';
                return;
            }

            if (!Number.isInteger(Number(peopleVal)) || isNaN(people) || people <= 0) {
                errorDiv.textContent = 'Number of people must be a whole number greater than zero.';
                errorDiv.style.display = 'block';
                return;
            }

            // Calculation
            const totalTip = bill * (tip / 100);
            const totalAmount = bill + totalTip;
            const perPerson = totalAmount / people;

            amountDiv.textContent = `$${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
