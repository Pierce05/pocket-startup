<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingTab - Wedding Dinner Bill Splitter</title>
    <style>
        :root {
            --primary: #c5a059;
            --primary-dark: #a38144;
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-light: #777777;
            --border-color: #e6dec9;
            --error-color: #b00020;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(197, 160, 89, 0.15);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-family: 'Georgia', serif;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 28px;
            letter-spacing: 0.5px;
        }

        p.pitch {
            color: var(--text-light);
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        #result {
            margin-top: 24px;
            padding: 16px;
            background-color: #f7f4ec;
            border-radius: 6px;
            border: 1px dashed var(--primary);
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-dark);
            display: none;
        }

        #error {
            margin-top: 16px;
            color: var(--error-color);
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WeddingTab</h1>
        <p class="pitch">Split wedding dinner bills and service charges effortlessly among guests.</p>

        <div class="input-group">
            <label for="bill">Dinner Bill Amount ($)</label>
            <input type="number" id="bill" placeholder="e.g. 250.00" step="0.01" min="0">
        </div>

        <div class="input-group">
            <label for="people">Number of Guests</label>
            <input type="number" id="people" placeholder="e.g. 4" step="1" min="1">
        </div>

        <div class="input-group">
            <label for="tip">Service Charge / Tip (%)</label>
            <input type="number" id="tip" placeholder="e.g. 18" step="0.1" min="0">
        </div>

        <button id="calc">Calculate Share</button>

        <div id="result"></div>
        <div id="error"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            
            const resultEl = document.getElementById('result');
            const errorEl = document.getElementById('error');

            // Reset views
            resultEl.style.display = 'none';
            resultEl.textContent = '';
            errorEl.style.display = 'none';
            errorEl.textContent = '';

            // Validation logic for missing fields
            if (billInput === '' || peopleInput === '') {
                errorEl.textContent = 'Please enter both the dinner bill amount and the number of guests.';
                errorEl.style.display = 'block';
                return;
            }

            // Parse numbers strictly
            const bill = Number(billInput);
            const people = Number(peopleInput);
            const tip = tipInput === '' ? 0 : Number(tipInput);

            // Check if values are valid numbers, non-negative bill/tip, positive people count, and integer people count
            if (
                isNaN(bill) || isNaN(people) || isNaN(tip) ||
                bill < 0 || tip < 0 ||
                !Number.isInteger(people) || people <= 0
            ) {
                errorEl.textContent = 'Please enter valid positive numbers. Guest count must be a whole number of at least 1.';
                errorEl.style.display = 'block';
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalBill = bill + tipAmount;
            const perPerson = totalBill / people;

            // Display results
            resultEl.textContent = `Each guest's share: $${perPerson.toFixed(2)}`;
            resultEl.style.display = 'block';
        });
    </script>

</body>
</html>
