<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabSplit - Airport Ride Fare & Tip Splitter</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --text-light: #64748b;
            --error: #dc2626;
            --error-bg: #fef2f2;
            --success-bg: #f0fdf4;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
        }

        .header p {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
            color: var(--primary);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        #error {
            display: none;
            background-color: var(--error-bg);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            border: 1px solid #fecaca;
        }

        #result {
            display: none;
            background-color: var(--success-bg);
            color: #166534;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            text-align: center;
            border: 1px solid #bbf7d0;
        }

        #result .amount {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>CabSplit</h1>
            <p>Effortlessly split taxi fares and tips among groups sharing an airport ride.</p>
        </div>

        <div class="form-group">
            <label for="bill">Cab Fare ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" min="0" placeholder="15">
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" step="1" min="1" placeholder="1">
        </div>

        <button id="calc">Split Fare</button>

        <div id="error"></div>
        <div id="result">
            <div>Per Person Share</div>
            <div id="result-amount" class="amount">$0.00</div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const tipInput = document.getElementById('tip');
        const peopleInput = document.getElementById('people');
        const calcButton = document.getElementById('calc');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const resultAmount = document.getElementById('result-amount');

        calcButton.addEventListener('click', () => {
            const billValue = billInput.value.trim();
            const tipValue = tipInput.value.trim();
            const peopleValue = peopleInput.value.trim();

            // Clear previous states
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            errorDiv.textContent = '';

            // Parse values
            const bill = parseFloat(billValue);
            const tip = parseFloat(tipValue);
            const people = parseInt(peopleValue, 10);

            // Validation checks
            if (billValue === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid non-negative cab fare.');
                return;
            }

            if (tipValue === '' || isNaN(tip) || tip < 0) {
                showError('Please enter a valid non-negative tip percentage.');
                return;
            }

            if (peopleValue === '' || isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Please enter a valid whole number of people greater than zero.');
                return;
            }

            // Computation
            const totalTip = bill * (tip / 100);
            const totalAmount = bill + totalTip;
            const perPerson = totalAmount / people;

            // Display results
            resultAmount.textContent = `$${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
