<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeRun Splitter</title>
    <style>
        :root {
            --bg-color: #f7f3e9;
            --card-bg: #ffffff;
            --primary-color: #6f4e37;
            --primary-hover: #563b2a;
            --accent-color: #d2b48c;
            --text-color: #332211;
            --error-color: #c0392b;
            --error-bg: #fadbd8;
            --border-radius: 12px;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(111, 78, 55, 0.12);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            color: var(--primary-color);
            font-size: 24px;
        }

        .header p {
            margin: 0;
            font-size: 14px;
            color: #7f6e61;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 2px solid #e2d8cd;
            border-radius: 8px;
            font-size: 16px;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 18px;
            text-align: center;
            display: none;
        }

        #result {
            background-color: #f4efe6;
            border: 1px solid var(--accent-color);
            padding: 16px;
            border-radius: 8px;
            margin-top: 18px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: var(--primary-color);
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>☕ CoffeeRun Splitter</h1>
            <p>Quickly calculate and split tips and totals for the office coffee run.</p>
        </div>

        <div class="input-group">
            <label for="bill">Coffee & Pastry Total ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="input-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" min="0" placeholder="15">
        </div>

        <div class="input-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" step="1" min="1" placeholder="1">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value;
            const tipInput = document.getElementById('tip').value;
            const peopleInput = document.getElementById('people').value;
            
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');

            // Reset views
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';

            // Parse numbers
            const bill = parseFloat(billInput);
            const tip = parseFloat(tipInput);
            const people = parseFloat(peopleInput);

            // Validation checks
            if (billInput.trim() === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid coffee run total of 0 or greater.');
                return;
            }

            if (tipInput.trim() === '' || isNaN(tip) || tip < 0) {
                showError('Please enter a valid tip percentage of 0 or greater.');
                return;
            }

            if (peopleInput.trim() === '' || isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Please enter a whole number of people greater than zero.');
                return;
            }

            // Calculation
            const totalWithTip = bill * (1 + tip / 100);
            const perPerson = totalWithTip / people;

            // Display result
            resultDiv.textContent = `Per Person: $${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
