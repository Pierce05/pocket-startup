<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocySplit - Grocery Receipt & Tip Splitter</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --error-bg: #fee2e2;
            --error-text: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--primary-dark);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        p.pitch {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            border-color: var(--primary);
        }

        .items-container {
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            background: #fafafa;
        }

        .item-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            align-items: center;
        }

        .item-row input[type="text"] {
            flex: 2;
        }

        .item-row input[type="number"] {
            flex: 1;
        }

        button {
            cursor: pointer;
            font-weight: 600;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            transition: background-color 0.2s;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text);
            width: 100%;
            margin-bottom: 1.5rem;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .btn-danger {
            background: #fee2e2;
            color: var(--error-text);
            padding: 0.75rem;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
            font-size: 1.1rem;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 0.5rem;
            display: none;
        }

        #result h3 {
            color: var(--primary-dark);
            margin-bottom: 0.75rem;
            font-size: 1.1rem;
        }

        .share-list {
            list-style: none;
        }

        .share-item {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px dashed #d1fae5;
            font-size: 0.95rem;
        }

        .share-item:last-child {
            border-bottom: none;
        }

        .total-summary {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 2px solid #86efac;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>GrocySplit</h1>
            <p class="pitch">Easily split shared grocery receipts and delivery tips among roommates.</p>
        </header>

        <div id="error"></div>

        <div class="form-group">
            <label for="bill">Grocery Items & Costs</label>
            <div class="items-container" id="items-list">
                <!-- Dynamic item rows injected via JS -->
            </div>
            <button type="button" class="btn-secondary" id="add-item">+ Add Item</button>
        </div>

        <div class="form-group">
            <label for="people">Number of Roommates</label>
            <input type="number" id="people" min="1" placeholder="e.g., 3" value="2">
        </div>

        <div class="form-group">
            <label for="tip">Delivery Tip Percentage (%)</label>
            <input type="number" id="tip" min="0" step="0.5" placeholder="e.g., 15" value="15">
        </div>

        <button type="button" class="btn-primary" id="calc">Calculate Split</button>

        <div id="result">
            <!-- Results injected here -->
        </div>
    </div>

    <script>
        const itemsListEl = document.getElementById('items-list');
        const addItemBtn = document.getElementById('add-item');
        const calcBtn = document.getElementById('calc');
        const errorEl = document.getElementById('error');
        const resultEl = document.getElementById('result');
        const peopleEl = document.getElementById('people');
        const tipEl = document.getElementById('tip');

        // Initial default items for immediate usage
        const defaultItems = [
            { name: 'Milk & Eggs', cost: '6.50' },
            { name: 'Fresh Produce', cost: '14.25' },
            { name: 'Snacks', cost: '8.00' }
        ];

        function renderItems() {
            itemsListEl.innerHTML = '';
            defaultItems.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <input type="text" placeholder="Item name" value="${item.name}" data-index="${index}" data-type="name">
                    <input type="number" step="0.01" min="0" placeholder="Cost ($)" value="${item.cost}" data-index="${index}" data-type="cost">
                    <button type="button" class="btn-danger" onclick="removeItem(${index})">×</button>
                `;
                itemsListEl.appendChild(row);
            });
        }

        window.removeItem = function(index) {
            if (defaultItems.length === 1) {
                showError("You must have at least one grocery item.");
                return;
            }
            defaultItems.splice(index, 1);
            renderItems();
            clearResult();
        };

        addItemBtn.addEventListener('click', () => {
            defaultItems.push({ name: '', cost: '' });
            renderItems();
            clearResult();
        });

        itemsListEl.addEventListener('input', (e) => {
            const index = e.target.dataset.index;
            const type = e.target.dataset.type;
            if (index !== undefined && type) {
                defaultItems[index][type] = e.target.value;
            }
            clearResult();
        });

        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            resultEl.style.display = 'none';
            resultEl.innerHTML = '';
        }

        function clearResult() {
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';
        }

        calcBtn.addEventListener('click', () => {
            const numPeople = parseInt(peopleEl.value, 10);
            const tipPercent = parseFloat(tipEl.value);

            // Validation checks
            if (isNaN(numPeople) || numPeople <= 0) {
                showError("Please enter a valid number of roommates (at least 1).");
                return;
            }

            if (isNaN(tipPercent) || tipPercent < 0) {
                showError("Please enter a valid tip percentage (0 or higher).");
                return;
            }

            if (defaultItems.length === 0) {
                showError("Please add at least one grocery item.");
                return;
            }

            let subtotal = 0;
            for (let i = 0; i < defaultItems.length; i++) {
                const costVal = parseFloat(defaultItems[i].cost);
                if (isNaN(costVal) || costVal < 0) {
                    showError(`Item #${i + 1} has an invalid cost.`);
                    return;
                }
                subtotal += costVal;
            }

            if (subtotal === 0) {
                showError("Total grocery cost cannot be zero.");
                return;
            }

            // Calculations
            const tipAmount = subtotal * (tipPercent / 100);
            const grandTotal = subtotal + tipAmount;
            const perPerson = grandTotal / numPeople;
            const basePerPerson = subtotal / numPeople;
            const tipPerPerson = tipAmount / numPeople;

            // Render valid output matching criteria (per-person amount with two decimals in #result)
            errorEl.style.display = 'none';
            resultEl.style.display = 'block';
            
            let html = `
                <h3>Split Summary (${numPeople} Roommate${numPeople > 1 ? 's' : ''})</h3>
                <ul class="share-list">
                    <li class="share-item">
                        <span>Subtotal Share:</span>
                        <span>$${basePerPerson.toFixed(2)}</span>
                    </li>
                    <li class="share-item">
                        <span>Tip Share (${tipPercent}%):</span>
                        <span>$${tipPerPerson.toFixed(2)}</span>
                    </li>
                </ul>
                <div class="total-summary">
                    <span>Per-Person Total:</span>
                    <span>$${perPerson.toFixed(2)}</span>
                </div>
            `;
            resultEl.innerHTML = html;
        });

        // Initial setup
        renderItems();
    </script>
</body>
</html>
