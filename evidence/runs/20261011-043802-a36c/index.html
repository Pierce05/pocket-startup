<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocySplit</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --border: #d1d5db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: var(--primary-dark);
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
        }

        .pitch {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        #result {
            background-color: #ecfdf5;
            color: var(--primary-dark);
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        .result-label {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .result-amount {
            font-size: 1.75rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>GrocySplit</h1>
            <p class="pitch">Easily split shared grocery receipts and delivery tips among roommates.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Grocery Bill Amount ($)</label>
                <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
            </div>

            <div class="form-group">
                <label for="people">Number of Roommates</label>
                <input type="number" id="people" placeholder="1" step="1" min="1">
            </div>

            <div class="form-group">
                <label for="tip">Delivery Tip Percentage (%)</label>
                <input type="number" id="tip" placeholder="15" step="0.1" min="0">
            </div>

            <button id="calc">Calculate Split</button>

            <div id="error"></div>
            <div id="result">
                <div class="result-label">Each roommate owes:</div>
                <div class="result-amount" id="result-amount">$0.00</div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            const tipInput = document.getElementById('tip').value.trim();

            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const resultAmount = document.getElementById('result-amount');

            // Reset views
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            resultAmount.textContent = '';

            // Validation checks for empty
            if (billInput === '' || peopleInput === '') {
                showError("Please enter both the grocery bill amount and the number of roommates.");
                return;
            }

            // Parse numbers
            const bill = Number(billInput);
            const peopleNum = Number(peopleInput);
            const tip = tipInput === '' ? 0 : Number(tipInput);

            if (isNaN(bill) || isNaN(peopleNum) || isNaN(tip)) {
                showError("Please enter valid numbers for all fields.");
                return;
            }

            if (bill < 0) {
                showError("Grocery bill amount cannot be negative.");
                return;
            }

            // Check if people is a valid integer and > 0
            if (peopleNum <= 0 || !Number.isInteger(peopleNum) || !Number.isInteger(Number(peopleInput))) {
                showError("Number of roommates must be a whole number greater than zero.");
                return;
            }

            if (tip < 0) {
                showError("Tip percentage cannot be negative.");
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalAmount = bill + tipAmount;
            const perPerson = totalAmount / peopleNum;

            // Display results
            resultAmount.textContent = `$${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const resultAmount = document.getElementById('result-amount');
            
            resultDiv.style.display = 'none';
            resultAmount.textContent = '';
            
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
