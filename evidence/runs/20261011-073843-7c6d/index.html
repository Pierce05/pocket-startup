<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrunchSplit</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --primary-hover: #fa5252;
            --bg: #fff5f5;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-light: #718096;
            --error: #e53e3e;
            --error-bg: #fff5f5;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
        }

        .header p {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix, .suffix {
            position: absolute;
            color: var(--text-light);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .prefix {
            left: 1rem;
        }

        .suffix {
            right: 1rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        input.has-prefix {
            padding-left: 2rem;
        }

        input.has-suffix {
            padding-right: 2rem;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        #error {
            display: none;
            background-color: var(--error-bg);
            color: var(--error);
            border: 1px solid #fed7d7;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        #result {
            display: none;
            margin-top: 1.5rem;
            padding: 1.25rem;
            background-color: #f7fafc;
            border-radius: 0.5rem;
            text-align: center;
            border: 1px solid var(--border);
        }

        .result-label {
            font-size: 0.875rem;
            color: var(--text-light);
            margin-bottom: 0.25rem;
        }

        .result-amount {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>BrunchSplit</h1>
            <p>Split group brunch bills easily and calculate suggested tips instantly.</p>
        </div>

        <div id="error"></div>

        <div class="form-group">
            <label for="bill">Total Bill Amount</label>
            <div class="input-wrapper">
                <span class="prefix">$</span>
                <input type="number" id="bill" class="has-prefix" placeholder="0.00" step="0.01">
            </div>
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage</label>
            <div class="input-wrapper">
                <input type="number" id="tip" class="has-suffix" placeholder="15" step="1">
                <span class="suffix">%</span>
            </div>
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <div class="input-wrapper">
                <input type="number" id="people" placeholder="1" step="1">
            </div>
        </div>

        <button id="calc">Calculate Split</button>

        <div id="result">
            <div class="result-label">Amount Per Person</div>
            <div class="result-amount" id="result-amount">$0.00</div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const tipInput = document.getElementById('tip');
        const peopleInput = document.getElementById('people');
        const calcButton = document.getElementById('calc');
        const resultContainer = document.getElementById('result');
        const resultAmount = document.getElementById('result-amount');
        const errorDiv = document.getElementById('error');

        calcButton.addEventListener('click', () => {
            const billVal = billInput.value.trim();
            const tipVal = tipInput.value.trim();
            const peopleVal = peopleInput.value.trim();

            // Clear previous outputs
            errorDiv.style.display = 'none';
            resultContainer.style.display = 'none';
            errorDiv.textContent = '';

            // Check for empty fields
            if (billVal === '' || tipVal === '' || peopleVal === '') {
                showError('Please fill out all fields.');
                return;
            }

            const bill = Number(billVal);
            const tip = Number(tipVal);
            const people = Number(peopleVal);

            // Validate numeric inputs and ranges
            if (isNaN(bill) || bill < 0) {
                showError('Please enter a valid bill amount (0 or greater).');
                return;
            }

            if (isNaN(tip) || tip < 0) {
                showError('Please enter a valid tip percentage (0 or greater).');
                return;
            }

            if (isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Number of people must be a whole number greater than zero.');
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalBill = bill + tipAmount;
            const perPerson = totalBill / people;

            // Display results
            resultAmount.textContent = `$${perPerson.toFixed(2)}`;
            resultContainer.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
