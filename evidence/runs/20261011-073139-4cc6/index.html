<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingTab - Wedding Banquet Bill & Service Splitter</title>
    <style>
        :root {
            --bg-color: #fcfbf9;
            --card-bg: #ffffff;
            --primary: #c5a880;
            --primary-dark: #a3855e;
            --text-main: #2c2c2c;
            --text-muted: #666666;
            --error-color: #d9534f;
            --border-color: #e6e2dd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(197, 168, 128, 0.15);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: var(--primary-dark);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .symbol {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 12px 16px 12px 35px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            color: var(--text-main);
            background-color: #faf9f7;
            outline: none;
            transition: all 0.3s ease;
        }

        input.no-symbol {
            padding-left: 16px;
        }

        input:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(197, 168, 128, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        button:active {
            transform: scale(0.98);
        }

        #error {
            margin-top: 20px;
            padding: 12px;
            background-color: #fdf2f2;
            color: var(--error-color);
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f6f0;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #eae5db;
            display: none;
        }

        .result-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .result-amount {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>WeddingTab</h1>
            <p>Split wedding dinner bills and service charges effortlessly among guests.</p>
        </div>

        <div class="input-group">
            <label for="bill">Dinner Bill Total</label>
            <div class="input-wrapper">
                <span class="symbol">$</span>
                <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
            </div>
        </div>

        <div class="input-group">
            <label for="people">Number of Guests</label>
            <div class="input-wrapper">
                <input type="number" id="people" class="no-symbol" placeholder="1" min="1" step="1">
            </div>
        </div>

        <div class="input-group">
            <label for="tip">Service Charge Percentage</label>
            <div class="input-wrapper">
                <input type="number" id="tip" class="no-symbol" placeholder="18" min="0" step="0.1" value="18">
                <span class="symbol" style="left: auto; right: 14px;">%</span>
            </div>
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result">
            <div class="result-label">Per-Person Contribution</div>
            <div class="result-amount" id="result-amount">$0.00</div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const calcButton = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const resultAmountDiv = document.getElementById('result-amount');
        const errorDiv = document.getElementById('error');

        calcButton.addEventListener('click', () => {
            const billVal = billInput.value.trim();
            const peopleVal = peopleInput.value.trim();
            const tipVal = tipInput.value.trim();

            // Reset states
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';

            // Parse numbers
            const bill = parseFloat(billVal);
            const peopleNum = Number(peopleVal);
            const tip = tipVal === '' ? 0 : parseFloat(tipVal);

            // Validation logic
            if (billVal === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid, non-negative dinner bill total.');
                return;
            }

            if (peopleVal === '' || isNaN(peopleNum) || peopleNum <= 0 || !Number.isInteger(peopleNum) || !/^\d+$/.test(peopleVal)) {
                showError('Please enter a valid whole number of guests greater than zero.');
                return;
            }

            if (tipVal !== '' && (isNaN(tip) || tip < 0)) {
                showError('Please enter a valid, non-negative service charge percentage.');
                return;
            }

            // Calculation
            const tipMultiplier = 1 + (tip / 100);
            const totalWithTip = bill * tipMultiplier;
            const perPerson = totalWithTip / peopleNum;

            if (!isFinite(perPerson)) {
                showError('Calculation error. Please check your inputs.');
                return;
            }

            // Display valid output
            resultAmountDiv.textContent = `$${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            resultDiv.style.display = 'none';
        }
    </script>
</body>
</html>
