<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocySplit - Grocery & Tip Splitter</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-size: 1.75rem;
            color: var(--primary-dark);
            margin-bottom: 0.25rem;
        }

        header p {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix, .suffix {
            position: absolute;
            color: var(--text-light);
            font-size: 1rem;
        }

        .prefix {
            left: 1rem;
        }

        .suffix {
            right: 1rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input.has-prefix {
            padding-left: 2rem;
        }

        input.has-suffix {
            padding-right: 2rem;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }

        #result {
            margin-top: 1.5rem;
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 8px;
            padding: 1.25rem;
            text-align: center;
            display: none;
        }

        #result .label {
            font-size: 0.875rem;
            color: var(--text-light);
            margin-bottom: 0.25rem;
        }

        #result .amount {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>GrocySplit</h1>
            <p>Easily split shared grocery receipts and delivery tips among roommates.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Grocery Subtotal</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="number" id="bill" class="has-prefix" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="people">Number of Roommates</label>
                <div class="input-wrapper">
                    <input type="number" id="people" placeholder="1" min="1" step="1">
                </div>
            </div>

            <div class="form-group">
                <label for="tip">Delivery Tip Percentage</label>
                <div class="input-wrapper">
                    <input type="number" id="tip" class="has-suffix" placeholder="15" min="0" step="0.1">
                    <span class="suffix">%</span>
                </div>
            </div>

            <button id="calc">Calculate Split</button>

            <div id="error"></div>
            
            <div id="result">
                <div class="label">Per Person Total</div>
                <div class="amount" id="result-amount">$0.00</div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            const resultAmountEl = document.getElementById('result-amount');

            // Reset states
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';

            // Parse numbers
            const bill = parseFloat(billInput);
            const people = parseInt(peopleInput, 10);
            const tipPercent = tipInput === '' ? 0 : parseFloat(tipInput);

            // Validation checks
            if (billInput === '' || peopleInput === '') {
                showError("Please enter both the grocery subtotal and number of roommates.");
                return;
            }

            if (isNaN(bill) || isNaN(people) || isNaN(tipPercent)) {
                showError("Please enter valid numerical values.");
                return;
            }

            if (bill < 0) {
                showError("Grocery subtotal cannot be negative.");
                return;
            }

            if (people <= 0 || !Number.isInteger(people)) {
                showError("Number of roommates must be a whole number greater than zero.");
                return;
            }

            if (tipPercent < 0) {
                showError("Tip percentage cannot be negative.");
                return;
            }

            // Calculation
            const tipAmount = bill * (tipPercent / 100);
            const totalAmount = bill + tipAmount;
            const perPerson = totalAmount / people;

            // Display results
            resultAmountEl.textContent = '$' + perPerson.toFixed(2);
            resultEl.style.display = 'block';
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
