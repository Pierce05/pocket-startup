<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocySplit - Grocery & Delivery Bill Splitter</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f4f6f4;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --error-bg: #ffebee;
            --error-text: #c62828;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 26px;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input.has-prefix {
            padding-left: 28px;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 18px;
            text-align: center;
            display: none;
        }

        #result {
            background-color: #e8f5e9;
            color: var(--primary);
            padding: 20px;
            border-radius: 8px;
            margin-top: 18px;
            text-align: center;
            display: none;
        }

        #result .amount {
            font-size: 32px;
            font-weight: 700;
            margin-top: 4px;
        }

        #result .label {
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>GrocySplit</h1>
            <p>Easily split shared grocery receipts and delivery tips among roommates.</p>
        </div>

        <div class="form-group">
            <label for="bill">Grocery Subtotal ($)</label>
            <div class="input-wrapper">
                <span class="prefix">$</span>
                <input type="number" id="bill" class="has-prefix" placeholder="0.00" step="0.01" min="0">
            </div>
        </div>

        <div class="form-group">
            <label for="people">Number of Roommates</label>
            <input type="number" id="people" placeholder="2" min="1" step="1">
        </div>

        <div class="form-group">
            <label for="tip">Delivery Fee & Tip (%)</label>
            <input type="number" id="tip" placeholder="15" min="0" step="0.1">
        </div>

        <button id="calc">Calculate Share</button>

        <div id="error"></div>
        <div id="result">
            <div class="label">Each Person Owes</div>
            <div class="amount" id="result-amount">$0.00</div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const calcBtn = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const resultAmount = document.getElementById('result-amount');
        const errorDiv = document.getElementById('error');

        calcBtn.addEventListener('click', () => {
            const billVal = billInput.value.trim();
            const peopleVal = peopleInput.value.trim();
            const tipVal = tipInput.value.trim();

            // Reset view states
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';

            // Parse values
            const bill = parseFloat(billVal);
            const peopleNum = Number(peopleVal);
            const tipPct = tipVal === '' ? 0 : parseFloat(tipVal);

            // Validation checks
            if (billVal === '' || peopleVal === '') {
                showError('Please enter both the grocery subtotal and number of roommates.');
                return;
            }

            if (isNaN(bill) || isNaN(peopleNum) || isNaN(tipPct)) {
                showError('Please enter valid numeric values.');
                return;
            }

            if (bill < 0) {
                showError('Grocery subtotal cannot be negative.');
                return;
            }

            if (peopleNum <= 0 || !Number.isInteger(peopleNum)) {
                showError('Number of roommates must be a whole number greater than zero.');
                return;
            }

            if (tipPct < 0) {
                showError('Delivery tip percentage cannot be negative.');
                return;
            }

            // Calculation
            const tipAmount = bill * (tipPct / 100);
            const total = bill + tipAmount;
            const perPerson = total / peopleNum;

            // Output result
            resultAmount.textContent = '$' + perPerson.toFixed(2);
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
