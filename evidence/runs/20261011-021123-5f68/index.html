<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillSplit - The Easiest Way to Split Bills</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .pitch {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
            font-size: 1rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input.has-prefix {
            padding-left: 2rem;
        }

        input:focus {
            border-color: var(--primary);
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .tip-btn {
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tip-btn:hover, .tip-btn.active {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        button#calc {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button#calc:hover {
            background-color: var(--primary-hover);
        }

        #error {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            min-height: 1.25rem;
        }

        #result {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            min-height: 3rem;
        }

        #result span {
            display: block;
            font-size: 2rem;
            color: var(--primary);
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BillSplit</h1>
            <p class="pitch">The easiest way for friends to calculate bills and tips at restaurants.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Total Bill Amount</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="number" id="bill" class="has-prefix" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>

            <div class="form-group">
                <label>Tip Percentage</label>
                <div class="tip-buttons">
                    <button type="button" class="tip-btn" data-tip="10">10%</button>
                    <button type="button" class="tip-btn" data-tip="15">15%</button>
                    <button type="button" class="tip-btn active" data-tip="18">18%</button>
                    <button type="button" class="tip-btn" data-tip="20">20%</button>
                </div>
                <div class="input-wrapper" style="margin-top: 0.5rem;">
                    <input type="number" id="tip" value="18" placeholder="Custom" min="0" max="500">
                </div>
            </div>

            <div class="form-group">
                <label for="people">Number of People</label>
                <div class="input-wrapper">
                    <input type="number" id="people" value="1" placeholder="1" min="1" step="1">
                </div>
            </div>

            <button id="calc">Calculate Share</button>

            <div id="error"></div>
            <div id="result"></div>
        </main>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const tipInput = document.getElementById('tip');
        const peopleInput = document.getElementById('people');
        const calcButton = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        const tipButtons = document.querySelectorAll('.tip-btn');

        // Quick tip button handler
        tipButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tipButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tipInput.value = btn.getAttribute('data-tip');
            });
        });

        // Clear custom button active states if input is manually typed
        tipInput.addEventListener('input', () => {
            tipButtons.forEach(b => {
                if (b.getAttribute('data-tip') === tipInput.value) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            });
        });

        calcButton.addEventListener('click', () => {
            errorDiv.textContent = '';
            resultDiv.innerHTML = '';

            const billVal = parseFloat(billInput.value);
            const tipVal = parseFloat(tipInput.value);
            const peopleVal = parseInt(peopleInput.value, 10);

            // Validation logic
            if (isNaN(billVal) || billVal <= 0) {
                errorDiv.textContent = 'Please enter a valid bill amount greater than 0.';
                return;
            }

            if (isNaN(tipVal) || tipVal < 0) {
                errorDiv.textContent = 'Please enter a valid tip percentage (0 or greater).';
                return;
            }

            if (isNaN(peopleVal) || peopleVal < 1 || !Number.isInteger(peopleVal)) {
                errorDiv.textContent = 'Please enter a valid number of people (at least 1).';
                return;
            }

            // Calculation
            const totalTip = billVal * (tipVal / 100);
            const totalAmount = billVal + totalTip;
            const perPerson = totalAmount / peopleVal;

            // Output
            resultDiv.innerHTML = `
                Amount Per Person
                <span>$${perPerson.toFixed(2)}</span>
            `;
        });
    </script>
</body>
</html>
