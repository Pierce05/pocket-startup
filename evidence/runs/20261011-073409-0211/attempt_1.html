<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrunchSplit - Effortless Bill & Tip Splitter</title>
    <style>
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --error-bg: #fef2f2;
            --error-text: #dc2626;
            --success-bg: #f0fdf4;
            --success-text: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        p.pitch {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.5rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-prefix {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.25rem;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-main);
            background: #fff;
            transition: all 0.2s ease;
            outline: none;
        }

        input.no-prefix {
            padding-left: 1rem;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.15);
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .tip-btn {
            padding: 0.6rem 0.2rem;
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .tip-btn:hover {
            border-color: var(--primary);
            color: var(--primary-dark);
        }

        .tip-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        button#calc {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.2);
        }

        button#calc:hover {
            background: var(--primary-dark);
        }

        button#calc:active {
            transform: scale(0.98);
        }

        #error {
            margin-top: 1.25rem;
            padding: 0.85rem;
            background: var(--error-bg);
            color: var(--error-text);
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            display: none;
            border: 1px solid #fecaca;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: var(--success-bg);
            color: var(--success-text);
            border-radius: 0.75rem;
            text-align: center;
            display: none;
            border: 1px solid #bbf7d0;
        }

        #result .label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        #result .amount {
            font-size: 2.25rem;
            font-weight: 800;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">🥞</div>
            <h1>BrunchSplit</h1>
            <p class="pitch">Split brunch bills effortlessly and calculate the perfect tip for your group.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Total Bill Amount</label>
                <div class="input-wrapper">
                    <span class="input-prefix">$</span>
                    <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="people">Number of People</label>
                <div class="input-wrapper">
                    <input type="number" id="people" class="no-prefix" placeholder="1" min="1" step="1" value="1">
                </div>
            </div>

            <div class="form-group">
                <label>Tip Percentage</label>
                <div class="tip-buttons">
                    <button type="button" class="tip-btn" data-tip="15">15%</button>
                    <button type="button" class="tip-btn" data-tip="18">18%</button>
                    <button type="button" class="tip-btn active" data-tip="20">20%</button>
                    <button type="button" class="tip-btn" data-tip="25">25%</button>
                </div>
                <div class="input-wrapper">
                    <span class="input-prefix">%</span>
                    <input type="number" id="tip" value="20" min="0" step="1">
                </div>
            </div>

            <button id="calc">Calculate Split</button>

            <div id="error"></div>
            <div id="result">
                <div class="label">Amount Per Person</div>
                <div class="amount">$<span id="per-person-val">0.00</span></div>
            </div>
        </main>

        <footer>
            Built for smooth weekends & fair shares.
        </footer>
    </div>

    <script>
        const tipButtons = document.querySelectorAll('.tip-btn');
        const tipInput = document.getElementById('tip');
        const calcBtn = document.getElementById('calc');
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const perPersonVal = document.getElementById('per-person-val');

        // Handle Quick Tip Button Clicks
        tipButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tipButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tipInput.value = btn.getAttribute('data-tip');
            });
        });

        // Clear quick tip highlighting if custom tip input changes manually
        tipInput.addEventListener('input', () => {
            const val = tipInput.value;
            tipButtons.forEach(btn => {
                if (btn.getAttribute('data-tip') === val) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        });

        // Calculation & Validation Logic
        calcBtn.addEventListener('click', () => {
            const billVal = parseFloat(billInput.value);
            const peopleVal = parseInt(peopleInput.value, 10);
            const tipVal = parseFloat(tipInput.value);

            // Validation checks
            if (isNaN(billVal) || billVal <= 0) {
                showError("Please enter a valid total bill amount greater than zero.");
                return;
            }

            if (isNaN(peopleVal) || peopleVal <= 0 || !Number.isInteger(peopleVal)) {
                showError("Please enter a valid number of people (at least 1).");
                return;
            }

            if (isNaN(tipVal) || tipVal < 0) {
                showError("Please enter a valid tip percentage (0 or greater).");
                return;
            }

            // Clear errors and compute calculation
            errorDiv.style.display = 'none';
            
            const totalTip = billVal * (tipVal / 100);
            const finalAmount = billVal + totalTip;
            const perPerson = finalAmount / peopleVal;

            perPersonVal.textContent = perPerson.toFixed(2);
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            resultDiv.style.display = 'none';
            perPersonVal.textContent = '0.00';
        }
    </script>
</body>
</html>
