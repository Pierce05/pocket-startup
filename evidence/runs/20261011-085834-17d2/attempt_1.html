<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocySplit</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --error: #ef4444;
            --error-bg: #fef2f2;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 6px;
            color: var(--text);
            text-align: center;
        }

        .pitch {
            font-size: 0.875rem;
            color: var(--text-light);
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        #error {
            display: none;
            background-color: var(--error-bg);
            color: var(--error);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-top: 16px;
            text-align: center;
            border: 1px solid #fecaca;
        }

        #result {
            display: none;
            background-color: #ecfdf5;
            color: var(--primary-dark);
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GrocySplit</h1>
        <div class="pitch">Easily split shared grocery receipts and delivery tips among roommates.</div>

        <div class="form-group">
            <label for="bill">Total Grocery Bill ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="tip">Tip & Fees Percentage (%)</label>
            <input type="number" id="tip" step="0.1" min="0" placeholder="15">
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" step="1" min="1" placeholder="2">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();

            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');

            // Reset UI states
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';

            // Parse numeric values
            const bill = Number(billInput);
            const tip = Number(tipInput);
            const people = Number(peopleInput);

            // Validation checks
            if (billInput === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid grocery bill amount (0 or greater).');
                return;
            }

            if (tipInput === '' || isNaN(tip) || tip < 0) {
                showError('Please enter a valid tip percentage (0 or greater).');
                return;
            }

            if (peopleInput === '' || isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Please enter a whole number of people greater than zero.');
                return;
            }

            // Calculation
            const totalWithTip = bill * (1 + tip / 100);
            const perPerson = totalWithTip / people;

            // Display results
            resultDiv.textContent = `Each person pays: $${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
