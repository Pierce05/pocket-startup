<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabSplit - Airport Taxi Fare & Tip Splitter</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --success-bg: #f0fdf4;
            --success-text: #166534;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .header p {
            margin: 0;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.875rem;
            margin-top: 16px;
            display: none;
            text-align: center;
        }

        #result {
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 16px;
            border-radius: 6px;
            font-size: 1.125rem;
            font-weight: bold;
            margin-top: 16px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>CabSplit</h1>
            <p>Easily split taxi fares and tips among friends after a shared group airport ride.</p>
        </div>

        <div class="input-group">
            <label for="bill">Total Taxi Fare ($)</label>
            <input type="number" id="bill" step="0.01" placeholder="0.00">
        </div>

        <div class="input-group">
            <label for="tip">Driver Gratuity (%)</label>
            <input type="number" id="tip" step="1" placeholder="15">
        </div>

        <div class="input-group">
            <label for="people">Number of Passengers</label>
            <input type="number" id="people" step="1" placeholder="1">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');

            // Reset display states
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';
            errorEl.textContent = '';
            resultEl.textContent = '';

            // Input validations
            if (billInput === '' || tipInput === '' || peopleInput === '') {
                showError('Please fill out all fields.');
                return;
            }

            const bill = Number(billInput);
            const tipPct = Number(tipInput);
            const people = Number(peopleInput);

            // Validate numeric and bounds constraints
            if (isNaN(bill) || bill < 0) {
                showError('Please enter a valid, non-negative taxi fare.');
                return;
            }

            if (isNaN(tipPct) || tipPct < 0) {
                showError('Please enter a valid, non-negative tip percentage.');
                return;
            }

            if (!Number.isInteger(people) || people <= 0) {
                showError('Number of people must be a positive whole integer.');
                return;
            }

            // Calculations
            const tipAmount = bill * (tipPct / 100);
            const totalAmount = bill + tipAmount;
            const perPerson = totalAmount / people;

            // Display success
            resultEl.textContent = `Each person pays: $${perPerson.toFixed(2)}`;
            resultEl.style.display = 'block';
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
