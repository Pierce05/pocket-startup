<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeRun Splitter</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --primary: #6f4e37;
            --primary-hover: #563b29;
            --accent: #d2b48c;
            --text-main: #332211;
            --text-muted: #776655;
            --error-bg: #fde8e8;
            --error-text: #c53030;
            --border-color: #e6dfd5;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(111, 78, 55, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            color: var(--primary);
            font-size: 24px;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #faf8f5;
            color: var(--text-main);
            transition: border-color 0.2s, background-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
            text-align: center;
        }

        #result {
            margin-top: 20px;
            padding: 16px;
            background-color: #f4efe6;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            display: none;
        }

        .coffee-icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="coffee-icon">☕</span>
            <h1>CoffeeRun Splitter</h1>
            <p>Quickly calculate and split tips and totals for the office coffee run.</p>
        </div>

        <div class="form-group">
            <label for="bill">Bill Total ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" min="0" placeholder="15">
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" step="1" min="1" placeholder="1">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const tipInput = document.getElementById('tip');
        const peopleInput = document.getElementById('people');
        const calcButton = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');

        calcButton.addEventListener('click', () => {
            // Reset views
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';

            const rawBill = billInput.value.trim();
            const rawTip = tipInput.value.trim();
            const rawPeople = peopleInput.value.trim();

            // Validation checks
            if (rawBill === '' || rawTip === '' || rawPeople === '') {
                showError("Please fill out all fields.");
                return;
            }

            const bill = Number(rawBill);
            const tipPct = Number(rawTip);
            const people = Number(rawPeople);

            if (isNaN(bill) || isNaN(tipPct) || isNaN(people)) {
                showError("All inputs must be valid numbers.");
                return;
            }

            if (bill < 0) {
                showError("Bill total cannot be negative.");
                return;
            }

            if (tipPct < 0) {
                showError("Tip percentage cannot be negative.");
                return;
            }

            if (!Number.isInteger(people) || people <= 0) {
                showError("Number of people must be a whole number greater than zero.");
                return;
            }

            // Calculation
            const tipAmount = bill * (tipPct / 100);
            const totalAmount = bill + tipAmount;
            const perPerson = totalAmount / people;

            // Output
            resultDiv.textContent = `Per Person: $${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
