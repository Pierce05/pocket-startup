<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Splitter & Tip Calculator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #cbd5e1;
            --error: #dc2626;
            --error-bg: #fee2e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .tip-btn {
            padding: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            background-color: #f1f5f9;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tip-btn:hover {
            background-color: #e2e8f0;
        }

        .tip-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        #error {
            display: none;
            background-color: var(--error-bg);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            text-align: center;
            font-weight: 500;
        }

        #error.visible {
            display: block;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background-color: #f8fafc;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .total-per-person {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .breakdown {
            font-size: 0.875rem;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bill Splitter</h1>

        <div id="error"></div>

        <div class="form-group">
            <label for="bill">Bill Subtotal ($)</label>
            <input type="number" id="bill" placeholder="0.00" min="0" step="0.01">
        </div>

        <div class="form-group">
            <label>Tip</label>
            <div class="tip-buttons">
                <button type="button" class="tip-btn" data-tip="10">10%</button>
                <button type="button" class="tip-btn" data-tip="15">15%</button>
                <button type="button" class="tip-btn active" data-tip="18">18%</button>
                <button type="button" class="tip-btn" data-tip="20">20%</button>
            </div>
            <input type="number" id="tip" placeholder="Custom tip percentage" value="18" min="0" step="0.1">
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" placeholder="1" value="1" min="0" step="1">
        </div>

        <div id="result">
            <div class="breakdown">Enter bill details above</div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const tipInput = document.getElementById('tip');
        const peopleInput = document.getElementById('people');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const tipButtons = document.querySelectorAll('.tip-btn');

        function calculate() {
            const billText = billInput.value.trim();
            const tipText = tipInput.value.trim();
            const peopleText = peopleInput.value.trim();

            const bill = parseFloat(billText);
            const tipPercent = parseFloat(tipText);
            const people = parseInt(peopleText, 10);

            let hasError = false;
            let errorMessage = '';

            // Validation checks
            if (isNaN(bill) || bill < 0) {
                if (billText !== '') {
                    hasError = true;
                    errorMessage = 'Please enter a valid non-negative bill amount.';
                }
            }

            if (isNaN(tipPercent) || tipPercent < 0) {
                if (tipText !== '') {
                    hasError = true;
                    errorMessage = 'Please enter a valid non-negative tip percentage.';
                }
            }

            if (isNaN(people) || people < 0) {
                if (peopleText !== '') {
                    hasError = true;
                    errorMessage = 'Number of people cannot be negative.';
                }
            } else if (people === 0) {
                hasError = true;
                errorMessage = 'Number of people must be greater than zero.';
            }

            if (hasError) {
                errorDiv.textContent = errorMessage;
                errorDiv.classList.add('visible');
                resultDiv.innerHTML = '';
                return;
            } else {
                errorDiv.textContent = '';
                errorDiv.classList.remove('visible');
            }

            // If fields are empty, show initial state
            if (billText === '' && tipText === '' && peopleText === '') {
                resultDiv.innerHTML = '<div class="breakdown">Enter bill details above</div>';
                return;
            }

            const validBill = isNaN(bill) ? 0 : bill;
            const validTip = isNaN(tipPercent) ? 0 : tipPercent;
            const validPeople = (isNaN(people) || people <= 0) ? 1 : people;

            const tipAmount = validBill * (validTip / 100);
            const totalBill = validBill + tipAmount;
            
            const subtotalPerPerson = validBill / validPeople;
            const tipPerPerson = tipAmount / validPeople;
            const totalPerPerson = totalBill / validPeople;

            resultDiv.innerHTML = `
                <div class="breakdown">Each person pays</div>
                <div class="total-per-person">$${totalPerPerson.toFixed(2)}</div>
                <div class="breakdown">
                    Subtotal share: $${subtotalPerPerson.toFixed(2)}<br>
                    Tip share: $${tipPerPerson.toFixed(2)}
                </div>
            `;
        }

        // Event Listeners
        billInput.addEventListener('input', calculate);
        tipInput.addEventListener('input', () => {
            // Remove active state from quick buttons if custom typed
            tipButtons.forEach(btn => {
                if (btn.getAttribute('data-tip') === tipInput.value) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            calculate();
        });
        peopleInput.addEventListener('input', calculate);

        tipButtons.forEach(button => {
            button.addEventListener('click', () => {
                tipButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                tipInput.value = button.getAttribute('data-tip');
                calculate();
            });
        });

        // Initial run
        calculate();
    </script>
</body>
</html>
