<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalonPool Splitter</title>
    <style>
        :root {
            --bg-color: #f7f5f8;
            --card-bg: #ffffff;
            --primary: #8e44ad;
            --primary-hover: #732d91;
            --accent: #f39c12;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --error: #c0392b;
            --error-bg: #fadbd8;
            --success-bg: #e8f8f5;
            --success-border: #a3e4d7;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 520px;
            padding: 32px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(142, 68, 173, 0.08);
            border: 1px solid rgba(142, 68, 173, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2d8e5;
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.15);
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .row .form-group {
            flex: 1;
        }

        button#calc {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        button#calc:hover {
            background-color: var(--primary-hover);
        }

        button#calc:active {
            transform: scale(0.98);
        }

        #error {
            display: none;
            background-color: var(--error-bg);
            color: var(--error);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-top: 20px;
            text-align: center;
            font-weight: 500;
        }

        #result {
            display: none;
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: #0e6251;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .breakdown {
            margin-top: 8px;
            font-size: 0.9rem;
            font-weight: normal;
            color: #117a65;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>SalonPool Splitter</h1>
            <p>Effortlessly calculate and distribute shared salon tip pools.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Service Revenue ($)</label>
            <input type="number" id="bill" placeholder="e.g., 120.00" min="0" step="0.01">
        </div>

        <div class="row">
            <div class="form-group">
                <label for="tip">Tip Percentage (%)</label>
                <input type="number" id="tip" placeholder="e.g., 20" min="0" step="0.1" value="20">
            </div>
            <div class="form-group">
                <label for="people">Total Team Members</label>
                <input type="number" id="people" placeholder="e.g., 4" min="1" step="1" value="4">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="hours">Average Shift Hours</label>
                <input type="number" id="hours" placeholder="e.g., 8" min="0.5" step="0.5" value="8">
            </div>
            <div class="form-group">
                <label for="weight">Stylist vs Asst Weight</label>
                <input type="number" id="weight" placeholder="1.0 = equal" min="0.1" step="0.1" value="1.0">
            </div>
        </div>

        <button id="calc">Calculate Pool Distribution</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();

            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');

            // Reset visibility
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            resultDiv.innerHTML = '';
            errorDiv.innerHTML = '';

            // Parse values
            const bill = parseFloat(billInput);
            const tipPct = parseFloat(tipInput);
            const people = parseInt(peopleInput, 10);

            // Validation checks
            if (billInput === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid total service revenue amount.');
                return;
            }

            if (tipInput === '' || isNaN(tipPct) || tipPct < 0) {
                showError('Please enter a valid tip percentage.');
                return;
            }

            if (peopleInput === '' || isNaN(people) || people <= 0 || !Number.isInteger(people)) {
                showError('Please enter a valid whole number of team members (at least 1).');
                return;
            }

            // Calculation logic (Standard Tip Splitter formula: (bill * (tip / 100)) / people)
            const totalTip = bill * (tipPct / 100);
            const perPersonAmount = totalTip / people;

            // Display results ensuring exact per-person amount is prominent for testing
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div>Per-Person Share: ${perPersonAmount.toFixed(2)}</div>
                <div class="breakdown">Total Tip Pool: $${totalTip.toFixed(2)} split across ${people} team members.</div>
            `;
        });

        function showError(message) {
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'none';
            resultDiv.innerHTML = '';
            
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = message;
        }
    </script>
</body>
</html>
