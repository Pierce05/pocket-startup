<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingTableSplit</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg: #fdf4ff;
            --card-bg: #ffffff;
            --text: #1f2937;
            --error: #dc2626;
            --border: #f3e8ff;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #6b21a8;
        }

        .pitch {
            font-size: 0.875rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: #4b5563;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            min-height: 1.25rem;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #faf5ff;
            border-radius: 8px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            color: #6b21a8;
            display: none;
            border: 1px solid #f3e8ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WeddingTableSplit</h1>
        <div class="pitch">Easily split wedding dinner bills and service charges among table guests.</div>

        <div class="input-group">
            <label for="bill">Total Bill Amount ($)</label>
            <input type="number" id="bill" placeholder="0.00" step="0.01">
        </div>

        <div class="input-group">
            <label for="tip">Tip / Service Charge (%)</label>
            <input type="number" id="tip" placeholder="15" step="0.1">
        </div>

        <div class="input-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" placeholder="1" step="1">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');

            // Reset display states
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';

            // Validation checks
            if (billInput === '' || tipInput === '' || peopleInput === '') {
                errorDiv.textContent = 'Please fill out all fields.';
                return;
            }

            const bill = parseFloat(billInput);
            const tip = parseFloat(tipInput);
            const people = Number(peopleInput);

            if (isNaN(bill) || isNaN(tip) || isNaN(people)) {
                errorDiv.textContent = 'Please enter valid numeric values.';
                return;
            }

            if (bill < 0) {
                errorDiv.textContent = 'Bill amount cannot be negative.';
                return;
            }

            if (tip < 0) {
                errorDiv.textContent = 'Tip percentage cannot be negative.';
                return;
            }

            if (!Number.isInteger(people) || people <= 0) {
                errorDiv.textContent = 'Number of people must be a whole number greater than zero.';
                return;
            }

            // Calculation
            const totalWithTip = bill * (1 + (tip / 100));
            const perPerson = totalWithTip / people;

            // Output
            resultDiv.textContent = `Per Person: $${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
