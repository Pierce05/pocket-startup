<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourPool - Tour Guide Tip Splitter</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --success-bg: #f0fdf4;
            --success-text: #166534;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        .header p {
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: var(--error-bg);
            color: var(--error-text);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            display: none;
        }

        #result {
            margin-top: 1rem;
            padding: 1rem;
            background-color: var(--success-bg);
            color: var(--success-text);
            border-radius: 0.5rem;
            font-size: 1.125rem;
            font-weight: bold;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>TourPool</h1>
            <p>Easily calculate and distribute tips evenly among your tour guide team.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Bill Amount ($)</label>
            <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" placeholder="15" step="0.1" min="0">
        </div>

        <div class="form-group">
            <label for="people">Number of Staff Members</label>
            <input type="number" id="people" placeholder="1" step="1" min="1">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();

            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');

            // Reset views
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';
            resultEl.textContent = '';
            errorEl.textContent = '';

            // Parse numbers
            const bill = Number(billInput);
            const tip = Number(tipInput);
            const people = Number(peopleInput);

            // Validation checks
            if (billInput === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid bill amount greater than or equal to 0.');
                return;
            }

            if (tipInput === '' || isNaN(tip) || tip < 0) {
                showError('Please enter a valid tip percentage greater than or equal to 0.');
                return;
            }

            if (peopleInput === '' || isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Please enter a whole number of staff members greater than zero.');
                return;
            }

            // Calculation (Total per person including bill share and tip share)
            const totalTip = bill * (tip / 100);
            const totalAmount = bill + totalTip;
            const perPerson = totalAmount / people;

            // Display result
            resultEl.textContent = `${perPerson.toFixed(2)}`;
            resultEl.style.display = 'block';
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
