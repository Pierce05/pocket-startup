<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckTab - Food Truck Festival Bill & Tip Splitter</title>
    <style>
        :root {
            --primary: #ff5722;
            --primary-dark: #e64a19;
            --secondary: #ffb300;
            --dark: #2d3748;
            --light: #f7fafc;
            --error: #e53e3e;
            --success: #38a169;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-top: 6px solid var(--primary);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        p.pitch {
            color: #718096;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--dark);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .tip-btn {
            background: #edf2f7;
            border: none;
            padding: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            color: var(--dark);
            transition: background 0.2s, color 0.2s;
        }

        .tip-btn:hover, .tip-btn.active {
            background: var(--secondary);
            color: #fff;
        }

        #calc {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        #calc:hover {
            background-color: var(--primary-dark);
        }

        #calc:active {
            transform: scale(0.98);
        }

        #error {
            background-color: #fff5f5;
            color: var(--error);
            border: 1px solid #feb2b2;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        #result {
            background-color: #f0fff4;
            color: var(--success);
            border: 1px solid #9ae6b4;
            padding: 16px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚚 TruckTab</h1>
            <p class="pitch">Easily split food truck festival bills and calculate fair tips for the whole family.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Total Festival Bill ($)</label>
                <input type="number" id="bill" step="0.01" min="0" placeholder="e.g. 74.50">
            </div>

            <div class="form-group">
                <label for="people">Number of Family Members</label>
                <input type="number" id="people" min="1" step="1" placeholder="e.g. 4">
            </div>

            <div class="form-group">
                <label for="tip">Tip Percentage (%)</label>
                <div class="tip-buttons">
                    <button type="button" class="tip-btn" data-val="10">10%</button>
                    <button type="button" class="tip-btn" data-val="15">15%</button>
                    <button type="button" class="tip-btn" data-val="18">18%</button>
                    <button type="button" class="tip-btn" data-val="20">20%</button>
                </div>
                <input type="number" id="tip" step="1" min="0" placeholder="Custom tip %" value="18">
            </div>

            <button id="calc">Split the Tab</button>

            <div id="error"></div>
            <div id="result"></div>
        </main>
    </div>

    <footer>
        TruckTab &bull; Festival Family Dining Calculator
    </footer>

    <script>
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const calcButton = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        const tipButtons = document.querySelectorAll('.tip-btn');

        // Preset tip buttons functionality
        tipButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tipButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tipInput.value = btn.getAttribute('data-val');
            });
        });

        // Set default active tip button matching default value
        tipButtons.forEach(btn => {
            if(btn.getAttribute('data-val') === tipInput.value) {
                btn.classList.add('active');
            }
        });

        calcButton.addEventListener('click', () => {
            const billVal = billInput.value.trim();
            const peopleVal = peopleInput.value.trim();
            const tipVal = tipInput.value.trim();

            // Reset displays
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.textContent = '';

            // Validation checks
            if (billVal === '' || peopleVal === '' || tipVal === '') {
                showError("Please fill out all fields to split the festival bill.");
                return;
            }

            const bill = parseFloat(billVal);
            const people = parseInt(peopleVal, 10);
            const tipPercent = parseFloat(tipVal);

            if (isNaN(bill) || isNaN(people) || isNaN(tipPercent) || 
                bill < 0 || people <= 0 || tipPercent < 0) {
                showError("Please enter valid positive numbers. People count must be at least 1.");
                return;
            }

            // Calculation
            const tipAmount = bill * (tipPercent / 100);
            const totalAmount = bill + tipAmount;
            const perPerson = totalAmount / people;

            if (!isFinite(perPerson)) {
                showError("Unable to calculate split. Please check your numbers.");
                return;
            }

            // Success display
            resultDiv.textContent = `Each person owes: $${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            resultDiv.style.display = 'none';
        }
    </script>
</body>
</html>
