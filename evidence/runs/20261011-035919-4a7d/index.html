<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BillSplit - Easy Group Bill & Tip Calculator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --error: #ef4444;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 0.25rem;
        }

        header p {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 0.75rem;
            color: var(--text-light);
            font-weight: 500;
        }

        .suffix {
            position: absolute;
            right: 0.75rem;
            color: var(--text-light);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input.has-prefix {
            padding-left: 1.75rem;
        }

        input.has-suffix {
            padding-right: 2rem;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .preset-tips {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .preset-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            padding: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover, .preset-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        #calc {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        #calc:hover {
            background-color: var(--primary-hover);
        }

        #error {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            min-height: 1.25rem;
            font-weight: 500;
        }

        #result-container {
            margin-top: 1.5rem;
            background-color: var(--bg);
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
        }

        .result-label {
            font-size: 0.875rem;
            color: var(--text-light);
            margin-bottom: 0.25rem;
        }

        #result {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            min-height: 2.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>BillSplit</h1>
            <p>Split restaurant bills and tips fairly</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Total Bill Amount</label>
                <div class="input-wrapper">
                    <span class="prefix">$</span>
                    <input type="number" id="bill" class="has-prefix" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="people">Number of People</label>
                <div class="input-wrapper">
                    <input type="number" id="people" placeholder="1" min="1" step="1" value="1">
                </div>
            </div>

            <div class="form-group">
                <label for="tip">Tip Percentage</label>
                <div class="input-wrapper">
                    <input type="number" id="tip" class="has-suffix" placeholder="15" min="0" value="15">
                    <span class="suffix">%</span>
                </div>
                <div class="preset-tips">
                    <button type="button" class="preset-btn" data-tip="10">10%</button>
                    <button type="button" class="preset-btn" data-tip="15">15%</button>
                    <button type="button" class="preset-btn" data-tip="18">18%</button>
                    <button type="button" class="preset-btn" data-tip="20">20%</button>
                </div>
            </div>

            <button type="button" id="calc">Calculate Split</button>

            <div id="error"></div>

            <div id="result-container">
                <div class="result-label">Amount Per Person</div>
                <div id="result"></div>
            </div>
        </main>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const calcBtn = document.getElementById('calc');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const presetButtons = document.querySelectorAll('.preset-btn');

        // Handle preset tip buttons
        presetButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                presetButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tipInput.value = btn.getAttribute('data-tip');
            });
        });

        // Clear active presets when custom tip is typed
        tipInput.addEventListener('input', () => {
            presetButtons.forEach(b => {
                if (b.getAttribute('data-tip') !== tipInput.value) {
                    b.classList.remove('active');
                } else {
                    b.classList.add('active');
                }
            });
        });

        calcBtn.addEventListener('click', () => {
            // Clear previous states
            errorDiv.textContent = '';
            resultDiv.textContent = '';

            const billVal = parseFloat(billInput.value);
            const peopleVal = parseInt(peopleInput.value, 10);
            const tipVal = parseFloat(tipInput.value);

            // Validation checks
            if (isNaN(billVal) || billVal < 0) {
                errorDiv.textContent = 'Please enter a valid bill amount.';
                return;
            }

            if (isNaN(peopleVal) || peopleVal <= 0 || !Number.isInteger(peopleVal)) {
                errorDiv.textContent = 'Number of people must be at least 1.';
                return;
            }

            if (isNaN(tipVal) || tipVal < 0) {
                errorDiv.textContent = 'Please enter a valid tip percentage.';
                return;
            }

            // Calculation
            const tipAmount = billVal * (tipVal / 100);
            const totalAmount = billVal + tipAmount;
            const perPerson = totalAmount / peopleVal;

            // Output result formatted to 2 decimal places
            resultDiv.textContent = `$${perPerson.toFixed(2)}`;
        });
    </script>
</body>
</html>
