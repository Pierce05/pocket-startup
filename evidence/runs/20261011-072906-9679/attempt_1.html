<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CabSplit - Airport Taxi Fare & Tip Splitter</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --success-bg: #f0fdf4;
            --success-text: #166534;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 440px;
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            color: var(--primary);
            font-size: 1.75rem;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        #result {
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 16px;
            border-radius: 6px;
            margin-top: 16px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>CabSplit</h1>
            <p>Easily split taxi fares and tips among friends after a group airport ride.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Fare & Tolls ($)</label>
            <input type="number" id="bill" placeholder="e.g. 45.50" step="0.01" min="0">
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" placeholder="e.g. 3" step="1" min="1">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" placeholder="e.g. 15" step="1" min="0" value="15">
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const calcButton = document.getElementById('calc');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');

        function calculateSplit() {
            const billVal = parseFloat(billInput.value);
            const peopleVal = parseInt(peopleInput.value, 10);
            const tipVal = parseFloat(tipInput.value);

            // Validation checks
            if (isNaN(billVal) || billVal < 0) {
                showError("Please enter a valid total fare amount.");
                return;
            }

            if (isNaN(peopleVal) || !Number.isInteger(peopleVal) || peopleVal <= 0) {
                showError("Please enter a valid number of people (at least 1).");
                return;
            }

            if (isNaN(tipVal) || tipVal < 0) {
                showError("Please enter a valid tip percentage (0 or greater).");
                return;
            }

            // Calculation
            const tipAmount = billVal * (tipVal / 100);
            const totalWithTip = billVal + tipAmount;
            const perPerson = totalWithTip / peopleVal;

            // Success state
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'block';
            resultDiv.textContent = `Each person pays: $${perPerson.toFixed(2)}`;
        }

        function showError(message) {
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';
            errorDiv.style.display = 'block';
            errorDiv.textContent = message;
        }

        calcButton.addEventListener('click', calculateSplit);
    </script>
</body>
</html>
