<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckTab - Food Truck Festival Bill & Tip Splitter</title>
    <style>
        :root {
            --primary: #d97706;
            --primary-hover: #b45309;
            --bg: #fffbeb;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #4b5563;
            --error: #dc2626;
            --error-bg: #fee2e2;
            --success-bg: #ecfdf5;
            --success-text: #065f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            display: none;
            background-color: var(--error-bg);
            color: var(--error);
            padding: 0.75rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 500;
        }

        #result {
            display: none;
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🚚 TruckTab</h1>
            <p>Easily split food truck festival bills and calculate tips across the whole family.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Festival Bill ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="e.g. 85.50">
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" step="1" min="1" placeholder="e.g. 4">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" min="0" placeholder="e.g. 18">
        </div>

        <button id="calc">Calculate Family Split</button>

        <div id="error"></div>
        <div id="result"></div>
    </div>

    <div class="footer">
        &copy; TruckTab Festival Tools
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');

            // Reset states
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.style.display = 'none';
            resultDiv.textContent = '';

            // Validation checks
            if (billInput === '' || peopleInput === '' || tipInput === '') {
                showError('Please fill out all fields.');
                return;
            }

            const bill = parseFloat(billInput);
            const people = parseInt(peopleInput, 10);
            const tip = parseFloat(tipInput);

            if (isNaN(bill) || isNaN(people) || isNaN(tip)) {
                showError('Please enter valid numerical values.');
                return;
            }

            if (bill < 0) {
                showError('Total festival bill cannot be negative.');
                return;
            }

            if (people <= 0 || !Number.isInteger(Number(peopleInput))) {
                showError('Number of people must be a whole number greater than zero.');
                return;
            }

            if (tip < 0) {
                showError('Tip percentage cannot be negative.');
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalWithTip = bill + tipAmount;
            const perPerson = totalWithTip / people;

            // Display success
            resultDiv.textContent = `Each person owes: $${perPerson.toFixed(2)}`;
            resultDiv.style.display = 'block';
        });

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
