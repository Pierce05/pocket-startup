<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourPool - Tour Guide Tip Splitter</title>
    <style>
        :root {
            --primary: #2b6cb0;
            --primary-dark: #2c5282;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-light: #718096;
            --error: #e53e3e;
            --success: #38a169;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: var(--primary);
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
        }

        p.pitch {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .input-with-icon {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-icon span {
            position: absolute;
            left: 1rem;
            color: var(--text-light);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-with-icon input {
            padding-left: 2rem;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        #error {
            background-color: #fff5f5;
            color: var(--error);
            border: 1px solid #feb2b2;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
            text-align: center;
        }

        #result {
            background-color: #f0fff4;
            color: var(--success);
            border: 1px solid #9ae6b4;
            padding: 1.25rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
            text-align: center;
        }

        #result .amount {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TourPool</h1>
            <p class="pitch">Easily calculate and distribute tips evenly among your tour guide team.</p>
        </header>

        <main>
            <div class="form-group">
                <label for="bill">Total Tour Revenue / Booking Value</label>
                <div class="input-with-icon">
                    <span>$</span>
                    <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="tip">Tip Percentage (%)</label>
                <input type="number" id="tip" placeholder="15" step="0.1" min="0">
            </div>

            <div class="form-group">
                <label for="people">Number of Guides / Team Members</label>
                <input type="number" id="people" placeholder="1" step="1" min="1">
            </div>

            <button id="calc">Calculate Pool Split</button>

            <div id="error"></div>
            <div id="result">
                <div>Per-Person Gratuity Share:</div>
                <div class="amount" id="result-amount">$0.00</div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            const resultAmountEl = document.getElementById('result-amount');

            // Reset states
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';
            errorEl.textContent = '';

            // Parse values
            const bill = parseFloat(billInput);
            const tip = parseFloat(tipInput);
            const people = parseInt(peopleInput, 10);

            // Validation checks
            if (billInput === '' || tipInput === '' || peopleInput === '') {
                showError('Please fill in all required fields.');
                return;
            }

            if (isNaN(bill) || isNaN(tip) || isNaN(people)) {
                showError('Please enter valid numeric values.');
                return;
            }

            if (bill < 0 || tip < 0) {
                showError('Revenue and tip percentage cannot be negative.');
                return;
            }

            if (people <= 0 || !Number.isInteger(people)) {
                showError('Number of guides must be a whole number greater than zero.');
                return;
            }

            // Calculation
            const totalTip = bill * (tip / 100);
            const perPerson = totalTip / people;

            if (!isFinite(perPerson)) {
                showError('Could not compute a valid distribution for the given inputs.');
                return;
            }

            // Display results
            resultAmountEl.textContent = '$' + perPerson.toFixed(2);
            resultEl.style.display = 'block';
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
