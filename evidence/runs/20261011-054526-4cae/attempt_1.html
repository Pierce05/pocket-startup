<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingTab - Wedding Dinner Bill Splitter</title>
    <style>
        :root {
            --primary: #d4af37;
            --primary-dark: #aa8c2c;
            --bg-color: #fcfbfa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --error-color: #d9534f;
            --border-color: #e2dedb;
        }

        body {
            font-family: 'Georgia', serif, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .pitch {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 25px;
            font-style: italic;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        #error {
            color: var(--error-color);
            background-color: #fdf2f2;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            padding: 10px;
            margin-top: 20px;
            font-size: 0.9rem;
            display: none;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background-color: #fdfbf7;
            border: 1px dashed var(--primary);
            border-radius: 4px;
            display: none;
        }

        #result .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 5px;
        }

        #result .amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WeddingTab</h1>
        <div class="pitch">Split wedding dinner bills and service charges effortlessly among guests.</div>

        <div class="input-group">
            <label for="bill">Table Bill Amount ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="input-group">
            <label for="tip">Tip / Service Charge (%)</label>
            <input type="number" id="tip" step="0.1" min="0" placeholder="18">
        </div>

        <div class="input-group">
            <label for="people">Number of Guests</label>
            <input type="number" id="people" step="1" min="1" placeholder="1">
        </div>

        <button id="calc">Calculate Share</button>

        <div id="error"></div>
        <div id="result">
            <div class="label">Per-Person Share</div>
            <div id="result-amount" class="amount">$0.00</div>
        </div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            const resultAmountEl = document.getElementById('result-amount');

            // Reset UI state
            errorEl.style.display = 'none';
            errorEl.textContent = '';
            resultEl.style.display = 'none';

            // Validate fields are not empty
            if (billInput === '' || tipInput === '' || peopleInput === '') {
                showError('Please fill out all fields completely.');
                return;
            }

            const bill = Number(billInput);
            const tip = Number(tipInput);
            const people = Number(peopleInput);

            // Validation checks
            if (isNaN(bill) || bill < 0) {
                showError('Please enter a valid, non-negative bill amount.');
                return;
            }

            if (isNaN(tip) || tip < 0) {
                showError('Please enter a valid, non-negative tip percentage.');
                return;
            }

            if (isNaN(people) || !Number.isInteger(people) || people <= 0) {
                showError('Please enter a valid positive whole number for the guests.');
                return;
            }

            // Calculation
            const totalWithTip = bill * (1 + (tip / 100));
            const perPerson = totalWithTip / people;

            // Display result
            resultAmountEl.textContent = '$' + perPerson.toFixed(2);
            resultEl.style.display = 'block';
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
