<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrocySplit - Grocery & Tip Splitter</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-hover: #1b5e20;
            --bg: #f4f9f4;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --error-bg: #ffebee;
            --error-text: #c62828;
            --result-bg: #e8f5e9;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.08);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            color: var(--primary);
            font-size: 24px;
        }

        .header p {
            margin: 0;
            color: #666;
            font-size: 14px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        #result {
            background-color: var(--result-bg);
            color: var(--primary);
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🛒 GrocySplit</h1>
            <p>Easily split shared grocery receipts and delivery tips among roommates.</p>
        </div>

        <div class="input-group">
            <label for="bill">Grocery Bill Total ($)</label>
            <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
        </div>

        <div class="input-group">
            <label for="tip">Delivery Tip Percentage (%)</label>
            <input type="number" id="tip" step="1" min="0" placeholder="15">
        </div>

        <div class="input-group">
            <label for="people">Number of Roommates</label>
            <input type="number" id="people" step="1" min="1" placeholder="2">
        </div>

        <button id="calc">Calculate Share</button>

        <div id="error"></div>
        <div id="result"></div>

        <div class="footer">
            Household Grocery & Tip Divider
        </div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');

            // Reset views
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';
            errorEl.textContent = '';
            resultEl.textContent = '';

            // Check if fields are empty
            if (billInput === '' || tipInput === '' || peopleInput === '') {
                errorEl.textContent = 'Please fill out all fields.';
                errorEl.style.display = 'block';
                return;
            }

            const bill = Number(billInput);
            const tip = Number(tipInput);
            const people = Number(peopleInput);

            // Validation checks according to prompt spec
            // Bill >= 0, Tip >= 0, People = whole number > 0
            const isBillValid = !isNaN(bill) && bill >= 0;
            const isTipValid = !isNaN(tip) && tip >= 0;
            const isPeopleValid = !isNaN(people) && Number.isInteger(people) && people > 0;

            if (!isBillValid || !isTipValid || !isPeopleValid) {
                errorEl.textContent = 'Invalid input. Please check that the bill and tip are zero or greater, and people is a whole number greater than zero.';
                errorEl.style.display = 'block';
                return;
            }

            // Calculation
            const tipAmount = bill * (tip / 100);
            const totalAmount = bill + tipAmount;
            const perPerson = totalAmount / people;

            // Display result formatted to two decimals
            resultEl.textContent = `Each person owes: $${perPerson.toFixed(2)}`;
            resultEl.style.display = 'block';
        });
    </script>
</body>
</html>
