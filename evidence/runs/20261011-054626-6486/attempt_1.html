<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeddingTab - Wedding Dinner Bill Splitter</title>
    <style>
        :root {
            --primary: #2c4a3e;
            --accent: #d4af37;
            --bg: #f7f9f6;
            --card-bg: #ffffff;
            --text: #333333;
            --error: #b33939;
            --border: #dcded8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(44, 74, 62, 0.08);
            width: 100%;
            max-width: 440px;
            padding: 32px;
            box-sizing: border-box;
            border-top: 4px solid var(--accent);
        }

        h1 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 600;
        }

        .pitch {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1e332a;
        }

        #error {
            background-color: #fdf2f2;
            color: var(--error);
            border: 1px solid #f8d7da;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        #result {
            background-color: #f1f5f3;
            color: var(--primary);
            border: 1px solid #d0ded7;
            padding: 16px;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #888;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>WeddingTab</h1>
        <div class="pitch">Split wedding dinner bills and service charges effortlessly among guests.</div>

        <div class="input-group">
            <label for="bill">Total Bill Amount ($)</label>
            <input type="number" id="bill" placeholder="0.00" step="0.01" min="0">
        </div>

        <div class="input-group">
            <label for="tip">Service Charge / Tip (%)</label>
            <input type="number" id="tip" placeholder="18" step="0.1" min="0">
        </div>

        <div class="input-group">
            <label for="people">Number of Guests</label>
            <input type="number" id="people" placeholder="1" step="1" min="1">
        </div>

        <button id="calc">Calculate Table Split</button>

        <div id="error"></div>
        <div id="result"></div>

        <div class="footer">Wedding Dinner Tab Management</div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const tipInput = document.getElementById('tip').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');

            // Reset views
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';
            errorEl.textContent = '';
            resultEl.textContent = '';

            // Check if inputs are empty
            if (billInput === '' || tipInput === '' || peopleInput === '') {
                errorEl.textContent = 'Please fill out all fields before calculating.';
                errorEl.style.display = 'block';
                return;
            }

            const bill = Number(billInput);
            const tip = Number(tipInput);
            const people = Number(peopleInput);

            // Validation rules:
            // 1. Bill >= 0
            // 2. Tip >= 0
            // 3. People must be a whole number > 0
            // 4. Ensure inputs are valid finite numbers
            if (isNaN(bill) || bill < 0) {
                errorEl.textContent = 'Please enter a valid bill amount (0 or greater).';
                errorEl.style.display = 'block';
                return;
            }

            if (isNaN(tip) || tip < 0) {
                errorEl.textContent = 'Please enter a valid service charge percentage (0 or greater).';
                errorEl.style.display = 'block';
                return;
            }

            if (isNaN(people) || !Number.isInteger(people) || people <= 0) {
                errorEl.textContent = 'Please enter a valid whole number of guests greater than zero.';
                errorEl.style.display = 'block';
                return;
            }

            // Calculation
            const totalWithTip = bill * (1 + tip / 100);
            const perPerson = totalWithTip / people;

            // Display result
            resultEl.textContent = `Each guest owes: $${perPerson.toFixed(2)}`;
            resultEl.style.display = 'block';
        });
    </script>
</body>
</html>
