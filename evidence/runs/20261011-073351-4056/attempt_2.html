<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeRun Splitter</title>
    <style>
        :root {
            --primary: #6f4e37;
            --primary-hover: #563b28;
            --bg: #f9f6f0;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --error: #d9534f;
            --error-bg: #fdf7f7;
            --border: #e0dcd0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(111, 78, 55, 0.08);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .prefix {
            position: absolute;
            left: 12px;
            color: var(--text-light);
            font-size: 15px;
        }

        .suffix {
            position: absolute;
            right: 12px;
            color: var(--text-light);
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            font-size: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
            color: var(--text);
        }

        .has-prefix input {
            padding-left: 28px;
        }

        .has-suffix input {
            padding-right: 28px;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error {
            display: none;
            background-color: var(--error-bg);
            color: var(--error);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 16px;
            text-align: center;
            border: 1px solid rgba(217, 83, 79, 0.2);
        }

        #result {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background-color: var(--bg);
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .result-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .result-amount {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>☕ CoffeeRun Splitter</h1>
            <p>Quickly calculate and split tips and totals for office coffee runs.</p>
        </div>

        <div class="form-group">
            <label for="bill">Total Bill Amount</label>
            <div class="input-wrapper has-prefix">
                <span class="prefix">$</span>
                <input type="number" id="bill" step="0.01" min="0" placeholder="0.00">
            </div>
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" min="1" step="1" placeholder="1">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage</label>
            <div class="input-wrapper has-suffix">
                <input type="number" id="tip" step="1" min="0" placeholder="15" value="15">
                <span class="suffix">%</span>
            </div>
        </div>

        <button id="calc">Calculate Split</button>

        <div id="error"></div>

        <div id="result">
            <div class="result-label">Amount Per Person</div>
            <div id="result-value" class="result-amount">$0.00</div>
        </div>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const billInput = document.getElementById('bill').value.trim();
            const peopleInput = document.getElementById('people').value.trim();
            const tipInput = document.getElementById('tip').value.trim();

            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            const resultValueEl = document.getElementById('result-value');

            // Reset view states
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';

            // Parse inputs
            const bill = parseFloat(billInput);
            const people = Number(peopleInput);
            const tip = tipInput === '' ? 0 : parseFloat(tipInput);

            // Validation checks
            if (billInput === '' || isNaN(bill) || bill < 0) {
                showError('Please enter a valid total bill amount.');
                return;
            }

            if (peopleInput === '' || isNaN(people) || people <= 0 || !Number.isInteger(people) || peopleInput.includes('.')) {
                showError('Please enter a valid whole number of people (at least 1).');
                return;
            }

            if (isNaN(tip) || tip < 0) {
                showError('Please enter a valid tip percentage.');
                return;
            }

            // Computation
            const tipMultiplier = 1 + (tip / 100);
            const totalWithTip = bill * tipMultiplier;
            const perPerson = totalWithTip / people;

            // Output valid result
            resultValueEl.textContent = '$' + perPerson.toFixed(2);
            resultEl.style.display = 'block';
        });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
