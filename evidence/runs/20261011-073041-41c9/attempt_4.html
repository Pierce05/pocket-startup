<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabToss - Bar Tab & Coworker Tip Splitter</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --card-bg: #182232;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2a374a;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        p.pitch {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .section {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }

        .section:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
            color: var(--text-main);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .setting-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .calc-btn {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            margin-top: 1rem;
            background: var(--accent);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .calc-btn:hover {
            background: var(--accent-hover);
        }

        #error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.8rem;
            border-radius: 6px;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        #result {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TabToss</h1>
            <p class="pitch">Split bar tabs and calculate coworker tips effortlessly after a night out.</p>
        </header>

        <!-- Bill / Total Tab -->
        <div class="section">
            <h2>1. Bar Tab Total</h2>
            <div class="setting-group">
                <label for="bill">Total Bill Amount ($)</label>
                <input type="number" id="bill" placeholder="e.g. 100.00" step="0.01" min="0" value="100">
            </div>
        </div>

        <!-- People / Attendees -->
        <div class="section">
            <h2>2. Coworker Attendees</h2>
            <div class="setting-group">
                <label for="people">Number of People</label>
                <input type="number" id="people" placeholder="e.g. 4" min="1" step="1" value="4">
            </div>
        </div>

        <!-- Tip Setting -->
        <div class="section">
            <h2>3. Tip Percentage</h2>
            <div class="setting-group">
                <label for="tip">Gratuity (%)</label>
                <input type="number" id="tip" value="20" min="0" step="1">
            </div>
        </div>

        <!-- Action & Output -->
        <div>
            <button type="button" id="calc" class="calc-btn">Calculate Tab Split</button>
            <div id="error"></div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const tipInput = document.getElementById('tip');
        const calcBtn = document.getElementById('calc');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');

        calcBtn.addEventListener('click', () => {
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.textContent = '';

            const rawBill = billInput.value.trim();
            const rawPeople = peopleInput.value.trim();
            const rawTip = tipInput.value.trim();

            const totalBill = parseFloat(rawBill);
            const numPeople = Number(rawPeople);
            const tipPercent = parseFloat(rawTip);

            if (rawBill === '' || isNaN(totalBill) || totalBill < 0) {
                errorDiv.textContent = "Please enter a valid bill amount.";
                errorDiv.style.display = 'block';
                return;
            }

            if (rawPeople === '' || isNaN(numPeople) || !Number.isInteger(numPeople) || numPeople <= 0) {
                errorDiv.textContent = "Please enter a valid whole number of people (at least 1).";
                errorDiv.style.display = 'block';
                return;
            }

            if (rawTip === '' || isNaN(tipPercent) || tipPercent < 0) {
                errorDiv.textContent = "Please enter a valid tip percentage.";
                errorDiv.style.display = 'block';
                return;
            }

            const tipAmount = totalBill * (tipPercent / 100);
            const grandTotal = totalBill + tipAmount;
            const perPerson = grandTotal / numPeople;

            resultDiv.textContent = perPerson.toFixed(2);
            resultDiv.style.display = 'block';
        });
    </script>
</body>
</html>
