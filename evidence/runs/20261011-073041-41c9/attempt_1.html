<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabToss - Bar Tab & Coworker Tip Splitter</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --card-bg: #182232;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2a374a;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        p.pitch {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .section {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }

        .section:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
            color: var(--text-main);
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        input, select {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        input[type="text"] {
            flex: 2;
        }

        input[type="number"] {
            flex: 1;
        }

        button {
            background: var(--accent);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 0.5rem;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .list-item button {
            background: transparent;
            color: var(--danger);
            padding: 0.2rem 0.5rem;
            font-size: 0.8rem;
        }

        .list-item button:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .setting-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .calc-btn {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            margin-top: 1rem;
        }

        #error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.8rem;
            border-radius: 6px;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        #result {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TabToss</h1>
            <p class="pitch">Split bar tabs and calculate coworker tips effortlessly after a night out.</p>
        </header>

        <!-- Drinks / Bill Items -->
        <div class="section">
            <h2>1. Add Bar Drinks & Items</h2>
            <div class="input-row">
                <input type="text" id="drink-name" placeholder="Drink / Item (e.g., IPA, Margarita)">
                <input type="number" id="drink-price" placeholder="Price ($)" step="0.01" min="0">
                <button type="button" id="add-drink-btn">Add</button>
            </div>
            <div id="bill-items-list" class="list-container">
                <!-- Dynamic drinks go here -->
            </div>
        </div>

        <!-- Attendees / People -->
        <div class="section">
            <h2>2. Add Coworker Attendees</h2>
            <div class="input-row">
                <input type="text" id="person-name" placeholder="Coworker Name (e.g., Sarah)">
                <button type="button" id="add-person-btn">Add</button>
            </div>
            <div id="people-list" class="list-container">
                <!-- Dynamic people go here -->
            </div>
        </div>

        <!-- Tip Setting -->
        <div class="section">
            <h2>3. Tip Percentage</h2>
            <div class="setting-group">
                <label for="tip">Gratuity (%)</label>
                <input type="number" id="tip" value="20" min="0" step="1">
            </div>
        </div>

        <!-- Action & Output -->
        <div>
            <button type="button" id="calc" class="calc-btn">Calculate Tab Split</button>
            <div id="error"></div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        // Internal state (memory only, no persistence)
        let drinks = [
            { name: "Round of Craft Beers", price: 36.00 },
            { name: "House Margaritas", price: 28.50 }
        ];
        let attendees = [
            "Alex (You)",
            "Jordan",
            "Taylor"
        ];

        const drinkNameInput = document.getElementById('drink-name');
        const drinkPriceInput = document.getElementById('drink-price');
        const addDrinkBtn = document.getElementById('add-drink-btn');
        const billItemsList = document.getElementById('bill-items-list');

        const personNameInput = document.getElementById('person-name');
        const addPersonBtn = document.getElementById('add-person-btn');
        const peopleList = document.getElementById('people-list');

        const calcBtn = document.getElementById('calc');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const tipInput = document.getElementById('tip');

        // Render functions
        function renderDrinks() {
            billItemsList.innerHTML = '';
            drinks.forEach((drink, index) => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <span>${drink.name} - $${drink.price.toFixed(2)}</span>
                    <button type="button" onclick="removeDrink(${index})">Remove</button>
                `;
                billItemsList.appendChild(item);
            });
        }

        function renderPeople() {
            peopleList.innerHTML = '';
            attendees.forEach((person, index) => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <span>${person}</span>
                    <button type="button" onclick="removePerson(${index})">Remove</button>
                `;
                peopleList.appendChild(item);
            });
        }

        window.removeDrink = function(index) {
            drinks.splice(index, 1);
            renderDrinks();
        }

        window.removePerson = function(index) {
            attendees.splice(index, 1);
            renderPeople();
        }

        addDrinkBtn.addEventListener('click', () => {
            const name = drinkNameInput.value.trim();
            const price = parseFloat(drinkPriceInput.value);
            if (name && !isNaN(price) && price >= 0) {
                drinks.push({ name, price });
                drinkNameInput.value = '';
                drinkPriceInput.value = '';
                renderDrinks();
            }
        });

        addPersonBtn.addEventListener('click', () => {
            const name = personNameInput.value.trim();
            if (name && !attendees.includes(name)) {
                attendees.push(name);
                personNameInput.value = '';
                renderPeople();
            }
        });

        // Required IDs bindings & logic mapping:
        // #bill -> acts as container/representation of items total
        // #people -> acts as container/representation of people count
        // #tip -> tip percentage value
        // #calc -> calculation trigger
        // #result -> output display
        // #error -> error message display

        calcBtn.addEventListener('click', () => {
            errorDiv.style.display = 'none';
            resultDiv.style.display = 'none';
            errorDiv.textContent = '';
            resultDiv.textContent = '';

            // Compute totals
            const totalBill = drinks.reduce((sum, d) => sum + d.price, 0);
            const numPeople = attendees.length;
            const tipPercent = parseFloat(tipInput.value);

            // Validation checks
            if (drinks.length === 0 || totalBill <= 0) {
                errorDiv.textContent = "Error: Please add at least one valid bar drink/item to the bill.";
                errorDiv.style.display = 'block';
                return;
            }

            if (numPeople === 0) {
                errorDiv.textContent = "Error: Please add at least one coworker attendee to split the tab.";
                errorDiv.style.display = 'block';
                return;
            }

            if (isNaN(tipPercent) || tipPercent < 0) {
                errorDiv.textContent = "Error: Please enter a valid tip percentage (0 or greater).";
                errorDiv.style.display = 'block';
                return;
            }

            // Calculation
            const tipAmount = totalBill * (tipPercent / 100);
            const grandTotal = totalBill + tipAmount;
            const perPerson = grandTotal / numPeople;

            // Display valid output
            resultDiv.textContent = `Each coworker owes: $${perPerson.toFixed(2)} (Subtotal: $${totalBill.toFixed(2)} + Tip: $${tipAmount.toFixed(2)})`;
            resultDiv.style.display = 'block';
        });

        // Initial render
        renderDrinks();
        renderPeople();
    </script>
</body>
</html>
